# Default values for the knowledgemanagement BDD test chart.

component:
  id: TMFC060
  name: knowledgemanagement
  functionalBlock: IntelligenceManagement
  publicationDate: 2026-11-22T00:00:00.000Z
  version: "0.1.0"
  # The draft Knowledge Management API. The URL is where Phase 1 publishes the OAS;
  # the Canvas operators don't download it.
  knowledgeApi:
    id: TMFxxx
    specification: https://raw.githubusercontent.com/hw-irc-sni/oda-canvas/ai-knowledge/source/components/TMFC060-KnowledgeManagement/knowledgeApiMicroservice/api/TMFxxx-KnowledgeManagement-v5.0.0.oas.yaml
  mcpApi:
    specification: https://modelcontextprotocol.io/specification/2025-06-18
  processFlowApi:
    specification: https://raw.githubusercontent.com/tmforum-apis/TMF701_ProcessFlow/master/TMF701-ProcessFlow-v4.0.0.swagger.json

security:
  canvasSystemRole: canvasRole
  # Static roles, declared in the Component's securityFunction.componentRole
  componentRole:
  - name: knowledge-viewer
    description: Read knowledge-bases, search, query and recommend
  - name: knowledge-editor
    description: Change knowledge-bases, upload documents and start ingestion
  - name: ontology-editor
    description: Create and propose ontology modules and mappings
  - name: ontology-reviewer
    description: Review ontology proposals and comment on them
  - name: ontology-approver
    description: Rule ontology proposals, publish and deprecate modules

# Provider DataResourceConfig (ADR-010). Rendered when the Canvas has the CRD, or when enabled is true.
dataResourceConfig:
  enabled: false
  providedDataResources:
  - name: knowledge-vectors
    type: vectorStore
    description: Hybrid dense and sparse vector store, one collection per knowledge-base
    engine: qdrant
    retrieval:
      topK: 8
      scoreThreshold: 0.3
      hybrid: true
  - name: knowledge-graph
    type: knowledgeGraph
    description: RDF graph store, one named graph per knowledge-base and per ontology module
    engine: pyoxigraph

mongodb:
  port: 27017
  database: tmf

# Stand-in workloads: the reference ProductCatalog images (see Chart.yaml)
api:
  image: tmforumodacanvas/productcatalogapi:1.0.0
  versionLabel: productcatalogapi-1.0.0
mcp:
  image: tmforumodacanvas/productcatalogmcp:1.0.0
  versionLabel: productcatalogmcp-1.0.0
partyrole:
  image: tmforumodacanvas/partyroleapi:1.0.0
  versionLabel: partyroleapi-1.0.0
metrics:
  image: tmforumodacanvas/productcatalogmetrics:1.0.0
  versionLabel: productcatalogmetrics-1.0.0
canvasinfo:
  host: info.canvas.svc.cluster.local
  basepath: /
