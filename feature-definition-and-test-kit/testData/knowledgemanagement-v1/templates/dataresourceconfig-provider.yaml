{{- /*
Provider DataResourceConfig (ADR-010): declares the component's vector store and knowledge graph to
the Canvas. Rendered only when the Canvas has the DataResourceConfig CRD, so the chart also installs
on a Canvas without it.
*/ -}}
{{- if or (.Capabilities.APIVersions.Has "oda.tmforum.org/v1alpha1/DataResourceConfig") .Values.dataResourceConfig.enabled }}
apiVersion: oda.tmforum.org/v1alpha1
kind: DataResourceConfig
metadata:
  name: {{.Release.Name}}-{{.Values.component.name}}
  labels:
    oda.tmforum.org/componentName: {{.Release.Name}}-{{.Values.component.name}}
    oda.tmforum.org/componentId: {{.Values.component.id}}
spec:
  provider: odaComponent
  role: provider
  providedDataResources:
  {{- range .Values.dataResourceConfig.providedDataResources }}
  - name: {{ .name }}
    type: {{ .type }}
    description: {{ .description | quote }}
    engine: {{ .engine }}
    exposedAPI: knowledgemanagement
    mcpAPI: knowledgemcp
    {{- with .retrieval }}
    retrieval: {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
{{- end }}
