# Stand-in for mcpServerMicroservice: the reference ProductCatalog MCP image (see Chart.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Release.Name}}-kmmcp
  labels:
    oda.tmforum.org/componentName: {{.Release.Name}}-{{.Values.component.name}}
spec:
  replicas: 1
  selector:
    matchLabels:
      impl: {{.Release.Name}}-kmmcp
  template:
    metadata:
      labels:
        app: {{.Release.Name}}-{{.Values.component.name}}
        impl: {{.Release.Name}}-kmmcp
        version: {{.Values.mcp.versionLabel}}
    spec:
      containers:
      - name: {{.Release.Name}}-kmmcp
        image: {{.Values.mcp.image}}
        env:
        - name: RELEASE_NAME
          value: {{.Release.Name}}
        - name: COMPONENT_NAME
          value: {{.Release.Name}}-{{.Values.component.name}}
        imagePullPolicy: IfNotPresent
        ports:
        - name: {{.Release.Name}}-kmmcp
          containerPort: 8080
