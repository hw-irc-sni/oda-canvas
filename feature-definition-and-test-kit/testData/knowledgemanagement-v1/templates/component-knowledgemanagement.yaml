apiVersion: oda.tmforum.org/v1
kind: Component
metadata:
  name: {{.Release.Name}}-{{.Values.component.name}}
  labels:
    oda.tmforum.org/componentName: {{.Release.Name}}-{{.Values.component.name}}
    oda.tmforum.org/componentId: {{.Values.component.id}}
spec:
  componentMetadata:
    id: {{.Values.component.id}}
    name: {{.Values.component.name}}
    functionalBlock: {{.Values.component.functionalBlock}}
    publicationDate: {{.Values.component.publicationDate}}
    status: specified
    version: {{.Values.component.version}}
    description: "TMFC060 Knowledge Management BDD test component: knowledge-bases and a governed, federated ontology."
  coreFunction:
    exposedAPIs:
    - name: knowledgemanagement
      specification:
      - url: {{.Values.component.knowledgeApi.specification | quote}}
      implementation: {{.Release.Name}}-kmapi
      apiType: openapi
      id: {{.Values.component.knowledgeApi.id}}
      path: /{{.Release.Name}}-{{.Values.component.name}}/tmf-api/knowledgeManagement/v5
      developerUI: /{{.Release.Name}}-{{.Values.component.name}}/tmf-api/knowledgeManagement/v5/docs
      port: 8080
    - name: processflow
      specification:
      - url: {{.Values.component.processFlowApi.specification | quote}}
      implementation: {{.Release.Name}}-kmprocessflow
      apiType: openapi
      id: TMF701
      path: /{{.Release.Name}}-{{.Values.component.name}}/tmf-api/process/v5
      developerUI: /{{.Release.Name}}-{{.Values.component.name}}/tmf-api/process/v5/docs
      port: 8080
    - name: knowledgemcp
      # The v1 Component CRD requires a specification; for MCP it is the protocol specification.
      specification:
      - url: {{.Values.component.mcpApi.specification | quote}}
      implementation: {{.Release.Name}}-kmmcp
      apiType: mcp
      path: /{{.Release.Name}}-{{.Values.component.name}}/mcp
      port: 8080
    dependentAPIs: []
  eventNotification:
    publishedEvents: []
    subscribedEvents: []
  managementFunction:
    exposedAPIs:
    - name: metrics
      apiType: prometheus
      implementation: {{.Release.Name}}-{{.Values.component.name}}-sm
      path: /{{.Release.Name}}-{{.Values.component.name}}/metrics
      port: 4000
  securityFunction:
    canvasSystemRole: {{ .Values.security.canvasSystemRole }}
    {{- with .Values.security.componentRole }}
    componentRole: {{- toYaml . | nindent 4 }}
    {{- end }}
    exposedAPIs:
    - name: partyrole
      specification:
      - url: "https://raw.githubusercontent.com/tmforum-apis/TMF669_PartyRole/master/TMF669-PartyRole-v4.0.0.swagger.json"
      implementation: {{.Release.Name}}-kmpartyroleapi
      apiType: openapi
      id: TMF669
      path: /{{.Release.Name}}-{{.Values.component.name}}/tmf-api/partyRoleManagement/v4
      developerUI: /{{.Release.Name}}-{{.Values.component.name}}/tmf-api/partyRoleManagement/v4/docs
      port: 8080
