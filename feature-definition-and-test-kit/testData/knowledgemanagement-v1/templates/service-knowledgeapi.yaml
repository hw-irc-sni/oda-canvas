apiVersion: v1
kind: Service
metadata:
  name: {{.Release.Name}}-kmapi
  labels:
    app: {{.Release.Name}}-{{.Values.component.name}}
    oda.tmforum.org/componentName: {{.Release.Name}}-{{.Values.component.name}}
spec:
  ports:
  - port: 8080
    targetPort: {{.Release.Name}}-kmapi
    name: http-{{.Release.Name}}-kmapi
  type: NodePort
  selector:
    impl: {{.Release.Name}}-kmapi
---
# The TMF701 v5 process API is served by the same pods as the knowledge API.
apiVersion: v1
kind: Service
metadata:
  name: {{.Release.Name}}-kmprocessflow
  labels:
    app: {{.Release.Name}}-{{.Values.component.name}}
    oda.tmforum.org/componentName: {{.Release.Name}}-{{.Values.component.name}}
spec:
  ports:
  - port: 8080
    targetPort: {{.Release.Name}}-kmapi
    name: http-{{.Release.Name}}-kmprocessflow
  type: NodePort
  selector:
    impl: {{.Release.Name}}-kmapi
