          $ref: '#/components/responses/Error'
  '/knowledgeSpecification/{id}/transition':
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listKnowledgeSpecificationTransition
      summary: Lists the lifecycle history of a module
      description: >-
        Lists the lifecycle transitions of the module and of its mappings, oldest first: those made by a review item (a proposal or a ruling), by a PATCH of `lifecycleStatus`, and by editing an agreed or published mapping, which takes it back to `draft`.
      tags:
        - knowledgeSpecification
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - ontology-editor
        - ontology-reviewer
        - ontology-approver
        - canvasSystemRole
      parameters:
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LifecycleTransition'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
  '/knowledgeSpecification/{id}/validation':
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: retrieveKnowledgeSpecificationValidation
      summary: Retrieves the latest validation report
      description: >-
        Returns the report of the latest validation run of the module.
      tags:
        - knowledgeSpecification
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - ontology-editor
        - ontology-reviewer
        - ontology-approver
        - canvasSystemRole
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationReport'
              examples:
                failing:
                  $ref: '#/components/examples/ValidationReport_failing'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: runKnowledgeSpecificationValidation
      summary: Validates a module
      description: >-
        Runs the structural checks (the five rules of the FTO check.py: parse, layer annotation, layer monotonicity, parents resolve, catalog integrity) and SHACL validation against the shapes the module imports, and returns the report.
      tags:
        - knowledgeSpecification
      x-required-roles:
        - ontology-editor
        - ontology-reviewer
        - ontology-approver
      responses:
        '200':
          description: The validation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationReport'
              examples:
                failing:
                  $ref: '#/components/examples/ValidationReport_failing'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
  '/schema/{name}':
    get:
      operationId: retrieveSchema
      summary: Retrieves an extension schema
      description: >-
        Returns a JSON Schema that the `@schemaLocation` of an extended resource points to, for example
        `FederatedKnowledgeSpecification.schema.json`.
      tags:
        - knowledgeSpecification
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - ontology-editor
        - ontology-reviewer
        - ontology-approver
        - canvasSystemRole
      parameters:
        - name: name
          in: path
          required: true
          description: The schema file name
          schema:
            type: string
      responses:
        '200':
          description: The JSON Schema
          content:
            application/schema+json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        default:
          $ref: '#/components/responses/Error'
  /knowledgeTerm:
    get:
      operationId: retrieveKnowledgeTerm
      summary: Searches ontology terms
      description: >-
        Searches the terms of the ontology modules by label, local name and definition, ranked (exact label, label
        prefix, label substring, IRI local name, then definition or comment). The FTO MCP tool fto_search. Describe a
        term with `/knowledgeTerm/describe`.
      tags:
        - knowledgeSpecification
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - ontology-editor
        - ontology-reviewer
        - ontology-approver
        - canvasSystemRole
      parameters:
        - name: q
          in: query
          required: true
          description: Text to search for in labels, local names and definitions.
          schema:
            type: string
            minLength: 1
            pattern: '\S'
        - name: limit
          in: query
          description: The maximum number of hits.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 25
        - name: includeUnpublished
          in: query
          description: >-
            Also look in modules that are not published (draft, proposed, inReview, agreed, rejected). By default only
            published and deprecated modules are searched.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The hits, best first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermLookupResult'
              examples:
                search:
                  $ref: '#/components/examples/Term_search'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
  /knowledgeTerm/describe:
    get:
      operationId: describeKnowledgeTerm
      summary: Describes an ontology term
      description: >-
        Describes one term (labels, definitions, defining modules, FTO layer, parents and SKOS matches), given as an
        IRI or a CURIE of a registered prefix; with `layerChain=true`, also its subclass chain with the layer of each
        term. A term no module mentions, or a CURIE with an unknown prefix, gives `404`. The FTO MCP tools
        fto_describe and fto_layer_of.
      tags:
        - knowledgeSpecification
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - ontology-editor
        - ontology-reviewer
        - ontology-approver
        - canvasSystemRole
      parameters:
        - name: iri
          in: query
          required: true
          description: The term, as an IRI or a CURIE.
          schema:
            type: string
            pattern: '^[A-Za-z][A-Za-z0-9+.-]*:[^\s<>"{}|^`\\]+$'
        - name: layerChain
          in: query
          description: Also return the subclass chain with the layer of each term.
          schema:
            type: boolean
            default: false
        - name: includeUnpublished
          in: query
          description: >-
            Also look in modules that are not published (draft, proposed, inReview, agreed, rejected). By default only
            published and deprecated modules are searched.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The description (and the layer chain when asked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermLookupResult'
              examples:
                describe:
                  $ref: '#/components/examples/Term_describe'
        '404':
          $ref: '#/components/responses/404'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
  /listener/knowledgeCreateEvent:
    post:
      operationId: knowledgeCreateEvent
      summary: Client listener for entity KnowledgeCreateEvent
      description: Example of a client listener for receiving the notification KnowledgeCreateEvent
      tags:
