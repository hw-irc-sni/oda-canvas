        $ref: '#/components/requestBodies/KnowledgeAttributeValueChangeEvent'
      responses:
        '204':
          description: Notified
        default:
          $ref: '#/components/responses/Error'
  /listener/knowledgeStateChangeEvent:
    post:
      operationId: knowledgeStateChangeEvent
      summary: Client listener for entity KnowledgeStateChangeEvent
      description: Example of a client listener for receiving the notification KnowledgeStateChangeEvent
      tags:
        - notification listener
      security: []
      requestBody:
        $ref: '#/components/requestBodies/KnowledgeStateChangeEvent'
      responses:
        '204':
          description: Notified
        default:
          $ref: '#/components/responses/Error'
  /listener/knowledgeDeleteEvent:
    post:
      operationId: knowledgeDeleteEvent
      summary: Client listener for entity KnowledgeDeleteEvent
      description: Example of a client listener for receiving the notification KnowledgeDeleteEvent
      tags:
        - notification listener
      security: []
      requestBody:
        $ref: '#/components/requestBodies/KnowledgeDeleteEvent'
      responses:
        '204':
          description: Notified
        default:
          $ref: '#/components/responses/Error'
  '/knowledge/{id}/proposal':
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listKnowledgeProposal
      summary: Lists the proposed changes of a knowledge-base
      description: >-
        The changes the ingestion pipeline (KM-FX-04 knowledge fusion) proposes instead of applying them: data in
        conflict with the shapes or rules (`dataConflict`, its triples withheld), classes and properties the ontology
        lacks (`ontologyTerm`), and entities with several possible matches (`entityLink`).
      tags:
        - knowledge
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      parameters:
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeProposal'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
  '/knowledge/{id}/proposal/{proposalId}':
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: proposalId
        in: path
        required: true
        description: Identifier of the proposal
        schema:
          type: string
    get:
      operationId: retrieveKnowledgeProposal
      summary: Retrieves a proposed change
      tags:
        - knowledge
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeProposal'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: patchKnowledgeProposal
      summary: Accepts or rejects a proposed change
      description: >-
        Set `state` to `accepted` or `rejected`. Accepting a `dataConflict` writes its withheld triples to the
        knowledge-base graph; accepting an `entityLink` needs `choice` (one of the candidates) and writes
        `owl:sameAs`. `ontologyTerm` proposals are decided on an ontology module (`409` here), as are proposals
        already decided. A deprecated knowledge-base cannot be changed (`409`).
      tags:
        - knowledge
      x-required-roles:
        - knowledge-editor
        - canvasSystemRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeProposal_MVO'
            example:
              state: accepted
              choice: https://example.org/cell/4711
      responses:
        '200':
          description: The decided proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeProposal'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
  '/eventSource/{kind}/{token}':
    parameters:
      - name: kind
        in: path
        required: true
        description: The TMF API the events come from.
        schema:
          type: string
          enum:
            - tmf639
            - tmf638
            - tmf642
            - tmf628
            - tmf921
      - name: token
        in: path
        required: true
        description: The secret of this hub registration (the callback URL is a capability).
        schema:
          type: string
    post:
      operationId: receiveSourceEvent
      summary: Receives a notification from a TMF provider (event-driven ingestion)
      description: >-
        The callback this component registers on the hub of each provider (TMF639, TMF638, TMF642, TMF628,
        TMF921) whose events a knowledge-base ingests (`source[].kind`). It needs no bearer token: the secret in
        the URL identifies the registration (`404` for an unknown one). The event goes to every knowledge-base
        whose `source[]` wants it (`eventTypes`, `query`), and is ingested in batches; anything else is ignored.
        The TMF v5 form `…/listener/{eventName}` is accepted too.
      tags:
        - knowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '204':
          description: Received (taken or ignored)
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        default:
          $ref: '#/components/responses/Error'
  '/knowledgeSpecification/{id}/validation/document':
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: validateDocument
      summary: Validates a document against a shapes module
      description: >-
        SHACL-validates the submitted RDF (for example an intent expression) against this module, which must be a
        `shapes` module (`409` otherwise), together with the shapes and ontology modules it imports. Nothing is
        stored. The FTO `validate` tool of the MCP server wraps this operation.
      tags:
        - knowledgeSpecification
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - ontology-editor
        - ontology-reviewer
        - ontology-approver
        - canvasSystemRole
      requestBody:
        required: true
        content:
          text/turtle:
            schema:
              type: string
              format: turtle
          application/ld+json:
            schema:
              $ref: '#/components/schemas/JsonLdDocument'
      responses:
        '200':
          description: The SHACL report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentValidationReport'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '415':
          $ref: '#/components/responses/415'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        An access token from the Canvas identity platform. The component client roles in
        `resource_access` are checked against the `x-required-roles` of each operation.
  schemas:
    DocumentValidationReport:
      type: object
      description: The SHACL validation of a submitted document against a shapes module.
      properties:
        shapesModule:
          type: string
        runAt:
          type: string
          format: date-time
        conforms:
          type: boolean
        results:
          type: array
          items:
            $ref: '#/components/schemas/ShaclResult'
    KnowledgeProposal:
      type: object
      description: A change the ingestion pipeline proposes for a knowledge-base; a person accepts or rejects it.
      properties:
        '@type':
          type: string
          enum:
            - KnowledgeProposal
        id:
          type: string
        href:
          type: string
        kind:
          type: string
          enum:
            - dataConflict
            - ontologyTerm
            - entityLink
        state:
          type: string
          enum:
            - proposed
            - accepted
            - rejected
        summary:
          type: string
        source:
          type: string
          description: The document or source batch the proposal came from.
        processId:
          type: string
          description: The ingestion process (TMF701) that made it.
        details:
          type: object
          additionalProperties: true
          description: >-
            `dataConflict`: `triples` (withheld), `violation` or `clash`; `ontologyTerm`: `term`, `role`, `count`,
            `example`; `entityLink`: `iri`, `label`, `type`, `candidates`.
        suggestion:
          type: object
          additionalProperties: true
          description: A model's suggested resolution (`action`, `rationale`), never applied by itself.
        decidedBy:
          type: string
        decidedAt:
          type: string
          format: date-time
        creationDate:
          type: string
          format: date-time
    KnowledgeProposal_MVO:
      type: object
      required:
        - state
      properties:
        state:
          type: string
          enum:
            - accepted
            - rejected
        choice:
          type: string
          description: For an `entityLink`, the candidate to link to.
    Addressable:
      type: object
      description: Base schema for addressable entities
      properties:
        href:
          type: string
          description: Hyperlink reference
        id:
          type: string
          description: unique identifier
    Extensible:
      type: object
      description: >-
        Base Extensible schema for use in TMForum Open-APIs - When used for in a schema it means
        that the Entity described by the schema MUST be extended with the @type
      properties:
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
      required:
        - '@type'
    Extensible_FVO:
      type: object
      description: >-
        The Extensible properties of a request body. In requests `@type` is optional everywhere, references
        included: the API sets it when it is missing. Responses use `Extensible`, where it is always present.
      properties:
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
    Entity:
      type: object
      description: Base entity schema for use in TMForum Open-APIs. Property.
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - $ref: '#/components/schemas/Addressable'
    EntityRef:
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - $ref: '#/components/schemas/Addressable'
        - type: object
          description: Entity reference schema to be use for all entityRef class.
          properties:
            id:
              type: string
              description: The identifier of the referred entity.
            href:
              type: string
              description: The URI of the referred entity.
            name:
              type: string
              description: Name of the referred entity.
            '@referredType':
              type: string
              description: The actual type of the target instance when needed for disambiguation.
          required:
            - id
    TimePeriod:
      type: object
      description: A period of time, either as a deadline (endDateTime only) a startDateTime only, or both
      properties:
        startDateTime:
          description: Start of the time period, using IETC-RFC-3339 format
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
        endDateTime:
          description: End of the time period, using IETC-RFC-3339 format
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
    PartyRef:
      type: object
      description: A Party reference
      allOf:
        - $ref: '#/components/schemas/EntityRef'
        - properties:
            '@type':
              type: string
              enum:
                - PartyRef
      discriminator:
        propertyName: '@type'
        mapping:
          PartyRef: '#/components/schemas/PartyRef'
    PartyRoleRef:
      allOf:
        - $ref: '#/components/schemas/EntityRef'
        - type: object
          description: Party role reference. A party role represents the part played by a party in a given context.
          properties:
            '@type':
              type: string
              enum:
                - PartyRoleRef
            partyId:
              type: string
              description: The identifier of the engaged party that is linked to the PartyRole object.
            partyName:
              type: string
              description: The name of the engaged party that is linked to the PartyRole object.
      discriminator:
        propertyName: '@type'
        mapping:
          PartyRoleRef: '#/components/schemas/PartyRoleRef'
    PartyRefOrPartyRoleRef:
      type: object
      description: A reference to a party or to a party role
      oneOf:
        - $ref: '#/components/schemas/PartyRef'
        - $ref: '#/components/schemas/PartyRoleRef'
      discriminator:
        propertyName: '@type'
        mapping:
          PartyRef: '#/components/schemas/PartyRef'
          PartyRoleRef: '#/components/schemas/PartyRoleRef'
    RelatedPartyRefOrPartyRoleRef:
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          description: >-
            RelatedParty reference. A related party defines party or party role or its reference,
            linked to a specific entity
          properties:
            role:
              description: >-
                Role played by the related party or party role in the context of the specific
                entity it is linked to. Such as 'owner', 'steward', 'contributor'
              type: string
            partyOrPartyRole:
              $ref: '#/components/schemas/PartyRefOrPartyRoleRef'
      discriminator:
        propertyName: '@type'
        mapping:
          RelatedPartyRefOrPartyRoleRef: '#/components/schemas/RelatedPartyRefOrPartyRoleRef'
    Event:
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          description: >-
            Event with common attributes. Each resource event (Create, AttributeValueChange,
            StateChange, Delete) extends it with an `event` payload that carries the resource.
          properties:
            href:
              type: string
              description: Hyperlink reference
            id:
              type: string
              description: unique identifier
            correlationId:
              type: string
              description: The correlation id for this event.
            domain:
              type: string
              description: The domain of the event.
            title:
              type: string
              description: The title of the event.
            description:
              type: string
              description: An explanation of the event.
            priority:
              type: string
              description: A priority.
            timeOccurred:
              type: string
              format: date-time
              description: The time the event occurred.
            source:
              $ref: '#/components/schemas/EntityRef'
            reportingSystem:
              $ref: '#/components/schemas/EntityRef'
            relatedParty:
              type: array
              description: Collection of related parties
              items:
                $ref: '#/components/schemas/RelatedPartyRefOrPartyRoleRef'
            eventId:
              type: string
              description: The identifier of the notification.
            eventTime:
              type: string
              format: date-time
              description: Time of the event occurrence.
            eventType:
              type: string
              description: The type of the notification.
            fieldPath:
              type: string
              description: >-
                For AttributeValueChange and StateChange events, the path of the changed
                attributes, as in TMF630.
      discriminator:
        propertyName: '@type'
        mapping:
          Event: '#/components/schemas/Event'
    Hub:
      type: object
      description: Sets the communication endpoint address the service instance must use to deliver notification information
      allOf:
        - $ref: '#/components/schemas/Entity'
        - properties:
            id:
              type: string
              description: Id of the listener
            callback:
              type: string
              format: callback-url
              description: >-
                The callback being registered: an http(s) URL whose host resolves to a public address, or matches the
                deployment's allowed callback hosts.
            query:
              type: string
              description: >-
                Additional data to be passed: a filter on the events to deliver, for example
                `eventType=KnowledgeCreateEvent`.
          required:
            - callback
    Hub_FVO:
      type: object
      description: Sets the communication endpoint address the service instance must use to deliver notification information
      required:
        - callback
      allOf:
        - $ref: '#/components/schemas/Extensible_FVO'
        - properties:
            '@type':
              type: string
              description: Optional in requests; the API sets it when missing.
              enum:
                - Hub
            callback:
              type: string
              format: callback-url
              description: >-
                The callback being registered: an http(s) URL whose host resolves to a public address, or matches the
                deployment's allowed callback hosts.
            query:
              type: string
              pattern: '^eventType=[A-Za-z]+(,[A-Za-z]+)*$'
              description: The events to deliver, for example `eventType=KnowledgeCreateEvent,KnowledgeDeleteEvent`.
    JsonPatch:
      type: object
      description: A JSONPatch document as defined by RFC 6902
      required:
        - op
        - path
      properties:
        op:
          type: string
          description: The operation to be performed
          enum:
            - add
            - remove
            - replace
            - move
            - copy
            - test
        path:
          type: string
          description: A JSON-Pointer
        value:
          description: The value to be used within the operations.
        from:
          type: string
          description: A string containing a JSON Pointer value.
    JsonPatchOperations:
      description: JSONPatch Operations document as defined by RFC 6902
      type: array
      items:
        $ref: '#/components/schemas/JsonPatch'
    Error:
      description: >-
        Used when an API throws an Error, typically with a HTTP error response-code (3xx, 4xx, 5xx).
        The TMF630 Error, extended with the members of RFC 7807 problem details (`type`, `title`,
        `detail`, `instance`). `status` keeps its TMF630 string type and carries the HTTP status
        code, as the RFC 7807 `status` member does.
      discriminator:
        propertyName: '@type'
        mapping:
          Error: '#/components/schemas/Error'
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          required:
            - code
            - reason
          properties:
            code:
              type: string
              description: Application relevant detail, defined in the API or a common list.
            reason:
              type: string
              description: Explanation of the reason for the error which can be shown to a client user.
            message:
              type: string
              description: More details and corrective actions related to the error which can be shown to a client user.
            status:
              type: string
              pattern: '^[1-5][0-9][0-9]$'
              description: HTTP Error code extension
            referenceError:
              type: string
              description: URI of documentation describing the error.
            type:
              type: string
              format: uri-reference
              description: RFC 7807 - a URI reference that identifies the problem type.
              default: about:blank
            title:
              type: string
              description: RFC 7807 - a short, human-readable summary of the problem type.
            detail:
              type: string
              description: RFC 7807 - a human-readable explanation specific to this occurrence of the problem.
            instance:
              type: string
              format: uri-reference
              description: RFC 7807 - a URI reference that identifies the specific occurrence of the problem.
    KnowledgeCategoryType:
      type: string
      description: The kind of knowledge a knowledge-base holds, from the TMFC060 inception form.
      enum:
        - know-what
        - know-why
        - know-how
        - know-who
    StoreKindType:
      type: string
      description: >-
        How a knowledge-base stores its knowledge: an RDF graph, a document and vector store, or
        both, linked (hybrid).
      enum:
        - graph
        - vector
        - hybrid
    KnowledgeSource:
      type: object
      description: >-
        A source the knowledge-base ingests from. `upload` takes documents uploaded to the
        knowledge-base. The `tmf…` kinds take events of that TM Forum API, delivered to the component
        through its subscribed events. `remote` takes content from a URL.
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - upload
            - tmf639
            - tmf638
            - tmf642
            - tmf628
            - tmf921
            - remote
          description: The kind of source.
        dependentApiName:
          type: string
          description: For `tmf…` kinds, the name of the component's dependent API that provides the events.
        eventTypes:
          type: array
          description: For `tmf…` kinds, the event types to ingest. All events of the API when empty.
          items:
            type: string
        query:
          type: string
          description: An optional filter on the source, in the source API's filter syntax.
        url:
          type: string
          format: uri
          description: For `remote`, the URL to ingest from.
    RetrievalSettings:
      type: object
      description: Default retrieval settings of a knowledge-base, used when a search request does not set them.
      properties:
        topK:
          type: integer
          minimum: 1
          maximum: 100
          default: 8
          description: Number of hits to return.
        scoreThreshold:
          type: number
          minimum: 0
          maximum: 1
          default: 0
          description: Minimum score of a hit.
        hybrid:
          type: boolean
          default: true
          description: Fuse dense (embedding) and sparse (BM25) scores.
    KnowledgeStatistics:
      type: object
      description: Size of a knowledge-base, computed by the component.
      readOnly: true
      properties:
        triples:
          type: integer
          minimum: 0
          description: Number of triples in the knowledge-base graph.
        documents:
          type: integer
          minimum: 0
          description: Number of documents.
        chunks:
          type: integer
          minimum: 0
          description: Number of indexed chunks in the vector store.
    Knowledge:
      allOf:
        - $ref: '#/components/schemas/Entity'
        - type: object
          description: >-
            A knowledge-base: an RDF instance graph and a document and vector store, linked so that
            search hits carry the IRIs of the entities they mention. It is typed by the ontology
            modules it conforms to.
          properties:
            name:
              type: string
              description: Name of the knowledge-base.
            description:
              type: string
              description: Description of the knowledge-base.
            version:
              type: string
              description: Version of the knowledge-base.
            lifecycleStatus:
              $ref: '#/components/schemas/GovernedLifecycleStatusType'
            lastUpdate:
              type: string
              format: date-time
              readOnly: true
              description: Date and time of the last update.
            knowledgeCategory:
              type: array
              items:
                $ref: '#/components/schemas/KnowledgeCategoryType'
            storeKind:
              $ref: '#/components/schemas/StoreKindType'
            conformsTo:
              type: array
              description: The ontology modules that type the knowledge-base.
              items:
                $ref: '#/components/schemas/KnowledgeSpecificationRef'
            source:
              type: array
              items:
                $ref: '#/components/schemas/KnowledgeSource'
            retrieval:
              $ref: '#/components/schemas/RetrievalSettings'
            statistics:
              $ref: '#/components/schemas/KnowledgeStatistics'
            relatedParty:
              type: array
              items:
                $ref: '#/components/schemas/RelatedPartyRefOrPartyRoleRef'
            validFor:
              $ref: '#/components/schemas/TimePeriod'
      discriminator:
        propertyName: '@type'
        mapping:
          Knowledge: '#/components/schemas/Knowledge'
      x-lifecycle:
        description: >-
          Allowed lifecycleStatus transitions of a knowledge-base and the role that may make each
          one: the governed lifecycle of ontology modules, with knowledge-editor as the proposer.
          A knowledge-base is created as draft. It can be read in every state; its content (graph,
          documents, ingestion) can be changed in every state except deprecated (409).
        initial: draft
        transitions:
          - {from: draft, to: proposed, role: knowledge-editor}
          - {from: proposed, to: inReview, role: ontology-reviewer}
          - {from: inReview, to: agreed, role: ontology-approver}
          - {from: inReview, to: rejected, role: ontology-approver}
          - {from: rejected, to: draft, role: knowledge-editor}
          - {from: agreed, to: published, role: ontology-approver}
          - {from: published, to: deprecated, role: ontology-approver}
        writableIn: [draft, proposed, inReview, agreed, rejected, published]
        readableIn: [draft, proposed, inReview, agreed, rejected, published, deprecated]
    Knowledge_FVO:
      allOf:
        - $ref: '#/components/schemas/Extensible_FVO'
        - type: object
          description: A knowledge-base, as given to create it.
          required:
            - name
          properties:
            '@type':
              type: string
              description: Optional in requests; the API sets it when missing.
              enum:
                - Knowledge
            name:
              type: string
              minLength: 1
              pattern: '\S'
            description:
              type: string
            version:
              type: string
            knowledgeCategory:
              type: array
              items:
                $ref: '#/components/schemas/KnowledgeCategoryType'
            storeKind:
              allOf:
                - $ref: '#/components/schemas/StoreKindType'
              default: hybrid
            conformsTo:
              type: array
              items:
                $ref: '#/components/schemas/KnowledgeSpecificationRef'
            source:
              type: array
              items:
                $ref: '#/components/schemas/KnowledgeSource'
            retrieval:
              $ref: '#/components/schemas/RetrievalSettings'
            relatedParty:
              type: array
              items:
                $ref: '#/components/schemas/RelatedPartyRefOrPartyRoleRef'
            validFor:
              $ref: '#/components/schemas/TimePeriod'
      discriminator:
        propertyName: '@type'
        mapping:
          Knowledge: '#/components/schemas/Knowledge_FVO'
    Knowledge_MVO:
      allOf:
        - $ref: '#/components/schemas/Extensible_FVO'
        - type: object
          description: >-
            The fields of a knowledge-base that can be changed. `storeKind` cannot change once the
            knowledge-base exists. A change of `lifecycleStatus` is a governance transition (see
            `x-lifecycle` on `Knowledge`).
          properties:
            '@type':
              type: string
              description: Optional in requests; the API sets it when missing.
              enum:
                - Knowledge
            name:
              type: string
            description:
              type: string
            version:
              type: string
            lifecycleStatus:
              $ref: '#/components/schemas/GovernedLifecycleStatusType'
            knowledgeCategory:
              type: array
              items:
                $ref: '#/components/schemas/KnowledgeCategoryType'
            conformsTo:
              type: array
              items:
                $ref: '#/components/schemas/KnowledgeSpecificationRef'
            source:
              type: array
              items:
                $ref: '#/components/schemas/KnowledgeSource'
            retrieval:
              $ref: '#/components/schemas/RetrievalSettings'
            relatedParty:
              type: array
              items:
                $ref: '#/components/schemas/RelatedPartyRefOrPartyRoleRef'
            validFor:
              $ref: '#/components/schemas/TimePeriod'
        - anyOf:
            - description: A lifecycle transition, on its own.
              required:
                - lifecycleStatus
              properties:
                'lifecycleStatus': {}
                '@type':
                  type: string
              additionalProperties: false
            - description: A change of fields, without lifecycleStatus.
              not:
                required:
                  - lifecycleStatus
      discriminator:
        propertyName: '@type'
        mapping:
          Knowledge: '#/components/schemas/Knowledge_MVO'
    KnowledgeRef:
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      description: Reference to a knowledge-base.
      discriminator:
        propertyName: '@type'
        mapping:
          KnowledgeRef: '#/components/schemas/KnowledgeRef'
    KnowledgeSpecificationRef:
      type: object
      description: >-
        Reference to an ontology module, by `id` or by `iri` (at least one; responses carry both). The EntityRef
        properties, with `iri` as an alternative identifier.
      anyOf:
        - required:
            - id
        - required:
            - iri
      properties:
        id:
          type: string
          description: Identifier of the module.
        iri:
          type: string
          format: uri
          description: The IRI of the ontology module, as an alternative way to identify it.
        href:
          type: string
          description: Hyperlink reference.
        name:
          type: string
          description: Name of the module.
        '@referredType':
          type: string
        '@type':
          type: string
        '@baseType':
          type: string
        '@schemaLocation':
          type: string
      discriminator:
        propertyName: '@type'
        mapping:
          KnowledgeSpecificationRef: '#/components/schemas/KnowledgeSpecificationRef'
    KnowledgeCreateEvent:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          description: KnowledgeCreateEvent generic structure
          properties:
            event:
              $ref: '#/components/schemas/KnowledgeEventPayload'
      discriminator:
        propertyName: '@type'
        mapping:
          KnowledgeCreateEvent: '#/components/schemas/KnowledgeCreateEvent'
    KnowledgeAttributeValueChangeEvent:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          description: KnowledgeAttributeValueChangeEvent generic structure
          properties:
            event:
              $ref: '#/components/schemas/KnowledgeEventPayload'
      discriminator:
        propertyName: '@type'
        mapping:
          KnowledgeAttributeValueChangeEvent: '#/components/schemas/KnowledgeAttributeValueChangeEvent'
    KnowledgeStateChangeEvent:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          description: KnowledgeStateChangeEvent generic structure
          properties:
            event:
              $ref: '#/components/schemas/KnowledgeEventPayload'
      discriminator:
        propertyName: '@type'
        mapping:
          KnowledgeStateChangeEvent: '#/components/schemas/KnowledgeStateChangeEvent'
    KnowledgeDeleteEvent:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          description: KnowledgeDeleteEvent generic structure
          properties:
            event:
              $ref: '#/components/schemas/KnowledgeEventPayload'
      discriminator:
        propertyName: '@type'
        mapping:
          KnowledgeDeleteEvent: '#/components/schemas/KnowledgeDeleteEvent'
    KnowledgeEventPayload:
      type: object
      description: The payload of a Knowledge event
      properties:
        knowledge:
          $ref: '#/components/schemas/Knowledge'
    JsonLdDocument:
      description: A JSON-LD document.
      oneOf:
        - type: object
          additionalProperties: true
        - type: array
          items:
            type: object
            additionalProperties: true
    SparqlResults:
      type: object
      description: SPARQL 1.1 query results in JSON (application/sparql-results+json), for SELECT and ASK.
      properties:
        head:
          type: object
          properties:
            vars:
              type: array
              items:
                type: string
            link:
              type: array
              items:
                type: string
        results:
          type: object
          properties:
            bindings:
              type: array
              items:
                type: object
                additionalProperties:
                  type: object
                  required:
                    - type
                    - value
                  properties:
                    type:
                      type: string
                      enum:
                        - uri
                        - literal
                        - bnode
                        - triple
                    value:
                      type: string
                    datatype:
                      type: string
                    xml:lang:
                      type: string
        boolean:
          type: boolean
          description: The result of an ASK query.
    SearchRequest:
      type: object
      description: A hybrid search over the chunks of a knowledge-base.
      required:
        - query
      properties:
        query:
          type: string
          minLength: 1
          pattern: '\S'
          description: The search text (not blank).
        topK:
          type: integer
          minimum: 1
          maximum: 100
        scoreThreshold:
          type: number
          minimum: 0
          maximum: 1
        hybrid:
          type: boolean
        iriFilter:
          type: array
          description: Keep only chunks that mention at least one of these IRIs.
          items:
            type: string
            format: uri
    SearchHit:
      type: object
      required:
        - chunkId
        - text
        - score
      properties:
        chunkId:
          type: string
        text:
          type: string
          description: The text of the chunk.
        score:
          type: number
          description: The fused relevance score.
        documentId:
          type: string
          description: The document the chunk comes from, if any.
        entityIri:
          type: array
          description: The IRIs of the graph entities the chunk mentions.
          items:
            type: string
            format: uri
    SearchResult:
      type: object
      properties:
        hits:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
    RecommendationRequest:
      type: object
      description: The context to recommend knowledge for; give a text `context`, context `iri`s, or both.
      anyOf:
        - required:
            - context
        - required:
            - iri
      properties:
        context:
          type: string
          minLength: 1
          pattern: '\S'
          description: A description of the situation, in text (not blank).
        iri:
          type: array
          minItems: 1
          description: Entities of the situation, by IRI.
          items:
            type: string
            format: uri
        topK:
          type: integer
          minimum: 1
          maximum: 100
          default: 5
    RecommendationItem:
      type: object
      required:
        - itemId
        - kind
        - score
      properties:
        itemId:
          type: string
        kind:
          type: string
          enum:
            - entity
            - document
            - chunk
        iri:
          type: string
          format: uri
          description: The IRI of the item, for an entity.
        label:
          type: string
        score:
          type: number
        signals:
          type: object
          description: The ranking signals behind the score.
          properties:
            successRate:
              type: number
              minimum: 0
              maximum: 1
            applicability:
              type: number
              minimum: 0
              maximum: 1
            usage:
              type: integer
              minimum: 0
              description: How often the item was used.
    RecommendationResult:
      type: object
      properties:
        recommendationId:
          type: string
          description: Identifies this recommendation, for feedback.
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationItem'
    RecommendationFeedback:
      type: object
      required:
        - recommendationId
        - itemId
      properties:
        recommendationId:
          type: string
        itemId:
          type: string
        used:
          type: boolean
          description: Whether the item was used.
        outcome:
          type: string
          enum:
            - success
            - failure
            - ignored
          description: The outcome of using the item.
    Document:
      type: object
      description: A document uploaded to a knowledge-base.
      properties:
        id:
          type: string
          readOnly: true
        href:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
        mediaType:
          type: string
          example: application/pdf
        size:
          type: integer
          minimum: 0
          description: Size in bytes.
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        uploadDate:
          type: string
          format: date-time
        ingestionState:
          type: string
          enum:
            - pending
            - ingested
            - failed
        lastIngestion:
          $ref: '#/components/schemas/ProcessRef'
    IngestRequest:
      type: object
      description: What to ingest.
      properties:
        source:
          type: string
          description: The kind of source to ingest from, one of the knowledge-base's `source[].kind`.
          enum:
            - upload
            - tmf639
            - tmf638
            - tmf642
            - tmf628
            - tmf921
            - remote
        documentId:
          type: array
          description: For `upload`, the documents to ingest. Every document not yet ingested when empty.
          items:
            type: string
        params:
          type: object
          description: Source-specific parameters, for example a TMF filter for an inventory snapshot.
          additionalProperties: true
    ProcessRef:
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      description: >-
        Reference to a TMF701 v5 process (`…/tmf-api/process/v5/process/{id}`), served by the
        component's process API (TMF701 Process Management v5).
      discriminator:
        propertyName: '@type'
        mapping:
          ProcessRef: '#/components/schemas/ProcessRef'
    OntologyLayerType:
      type: string
      description: The FTO layer of an ontology module (fto:layer).
      enum:
        - Foundational
        - Telecom
        - Implementation
    SpecKindType:
      type: string
      description: >-
        What an ontology module is. `bridge` modules hold mappings between modules; a `remote`
        module is a federation peer (a remote SPARQL endpoint or a peer TMFC060) found by IRI.
      enum:
        - ontology
        - vocabulary
        - shapes
        - bridge
        - remote
    GovernedLifecycleStatusType:
      type: string
      description: The governance lifecycle of knowledge-bases, ontology modules and mappings.
      enum:
        - draft
        - proposed
        - inReview
        - agreed
        - rejected
        - published
        - deprecated
    LinkStatusType:
      type: string
      description: How settled the module's links to its parents are (fto:linkStatus).
      enum:
        - provisional
        - confirmed
    KnowledgeSpecificationSource:
      description: Where the content of an ontology module comes from.
      oneOf:
        - $ref: '#/components/schemas/UploadSource'
        - $ref: '#/components/schemas/GitSource'
        - $ref: '#/components/schemas/MountSource'
        - $ref: '#/components/schemas/ComponentContributionSource'
        - $ref: '#/components/schemas/RemoteEndpointSource'
      discriminator:
        propertyName: kind
        mapping:
          upload: '#/components/schemas/UploadSource'
          git: '#/components/schemas/GitSource'
          mount: '#/components/schemas/MountSource'
          componentContribution: '#/components/schemas/ComponentContributionSource'
          remoteEndpoint: '#/components/schemas/RemoteEndpointSource'
    UploadSource:
      type: object
      description: The content is uploaded through `…/content`.
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - upload
    GitSource:
      type: object
      description: The content is a file in a git repository.
      required:
        - kind
        - url
        - path
      properties:
        kind:
          type: string
          enum:
            - git
        url:
          type: string
          minLength: 1
          description: The repository URL.
        ref:
          type: string
          default: main
          description: Branch, tag or commit.
        path:
          type: string
          minLength: 1
          description: Path of the module file in the repository.
        secretRef:
          type: string
          description: Name of the Kubernetes Secret with the git credentials, for a private repository.
    MountSource:
      type: object
      description: The content is a file on a volume mounted into the component (Secret or PVC).
      required:
        - kind
        - path
      properties:
        kind:
          type: string
          enum:
            - mount
        path:
          type: string
          minLength: 1
          description: Path of the module file in the container.
    ComponentContributionSource:
      type: object
      description: The content is contributed by another ODA Component.
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - componentContribution
        componentId:
          type: string
          description: The catalog id of the contributing component, for example TMFC001.
        componentName:
          type: string
          description: The name of the contributing component instance.
    RemoteEndpointSource:
      type: object
      description: >-
        A federation peer. Its content stays remote; queries reach it through SPARQL SERVICE once
        the module is published.
      required:
        - kind
        - url
      properties:
        kind:
          type: string
          enum:
            - remoteEndpoint
        url:
          type: string
          minLength: 1
          format: uri
          description: The SPARQL endpoint, or the query URL of the peer knowledge-base.
        endpointKind:
          type: string
          enum:
            - sparql
            - tmfc060
          default: sparql
          description: A plain SPARQL endpoint, or a peer TMFC060 knowledge-base.
    KnowledgeSpecification:
      allOf:
        - $ref: '#/components/schemas/Entity'
        - type: object
          description: >-
            An ontology module of the federated ontology, modelled on FTO's module registry.
          properties:
            name:
              type: string
              description: Name of the module (FTO label).
            description:
              type: string
              description: Purpose of the module.
            version:
              type: string
            iri:
              type: string
              format: uri
              description: The ontology IRI of the module. Unique; used to resolve owl:imports.
            prefix:
              type: string
              description: >-
                The preferred namespace prefix. A module that declares several prefixes lists them
                comma-separated, as in FTO modules.json.
            layer:
              $ref: '#/components/schemas/OntologyLayerType'
            specKind:
              $ref: '#/components/schemas/SpecKindType'
            depth:
              type: string
              description: How complete the module is, for example Full ontology, Vocabulary or Scaffold.
            owner:
              $ref: '#/components/schemas/RelatedPartyRefOrPartyRoleRef'
            imports:
              type: array
              description: The modules this module imports (owl:imports).
              items:
                $ref: '#/components/schemas/KnowledgeSpecificationRef'
            describes:
              type: array
              description: For a vocabulary, the modules whose terms it describes.
              items:
                $ref: '#/components/schemas/KnowledgeSpecificationRef'
            source:
              $ref: '#/components/schemas/KnowledgeSpecificationSource'
            lifecycleStatus:
              $ref: '#/components/schemas/GovernedLifecycleStatusType'
            linkStatus:
              $ref: '#/components/schemas/LinkStatusType'
            lastUpdate:
              type: string
              format: date-time
              readOnly: true
      discriminator:
        propertyName: '@type'
        mapping:
          KnowledgeSpecification: '#/components/schemas/KnowledgeSpecification'
          FederatedKnowledgeSpecification: '#/components/schemas/FederatedKnowledgeSpecification'
      x-lifecycle:
        description: >-
          Allowed lifecycleStatus transitions and the role that may make each one. Confirmed in
          hw-irc-sni/oda-canvas#5. A module is created as draft.
        initial: draft
        transitions:
          - {from: draft, to: proposed, role: ontology-editor}
          - {from: proposed, to: inReview, role: ontology-reviewer}
          - {from: inReview, to: agreed, role: ontology-approver, condition: validation passes}
          - {from: inReview, to: rejected, role: ontology-approver}
          - {from: rejected, to: draft, role: ontology-editor, condition: review history kept}
          - {from: agreed, to: published, role: ontology-approver}
          - {from: published, to: deprecated, role: ontology-approver}
        reviewComments: [proposed, inReview]
    FederatedKnowledgeSpecification:
      allOf:
        - $ref: '#/components/schemas/KnowledgeSpecification'
        - type: object
          description: >-
            An ontology module imported from a federation repository (modules.json and catalog.json, as in
            FTO) by the configured ontology source sync. The source repository governs it, so it is published;
            its status in the source is kept as `sourceStatus`. `@baseType` is `KnowledgeSpecification` and
            `@schemaLocation` points to the JSON Schema of this extension.
          properties:
            sourceStatus:
              type: string
              readOnly: true
              description: The status of the module in the source federation repository, for example provisional.
              example: provisional
    KnowledgeSpecification_FVO:
      allOf:
        - $ref: '#/components/schemas/Extensible_FVO'
        - type: object
          description: An ontology module, as given to register it. It starts as draft.
          required:
            - name
            - iri
            - specKind
            - source
          properties:
            '@type':
              type: string
              description: Optional in requests; the API sets it when missing.
              enum:
                - KnowledgeSpecification
                - FederatedKnowledgeSpecification
            name:
              type: string
              minLength: 1
              pattern: '\S'
              description: Name of the module (FTO label).
            description:
              type: string
              description: Purpose of the module.
            version:
              type: string
            iri:
              type: string
              minLength: 1
              format: uri
              description: The ontology IRI of the module. Unique; used to resolve owl:imports.
            prefix:
              type: string
              description: >-
                The preferred namespace prefix. A module that declares several prefixes lists them
                comma-separated, as in FTO modules.json.
            layer:
              $ref: '#/components/schemas/OntologyLayerType'
            specKind:
              $ref: '#/components/schemas/SpecKindType'
            depth:
              type: string
              description: How complete the module is, for example Full ontology, Vocabulary or Scaffold.
            owner:
              $ref: '#/components/schemas/RelatedPartyRefOrPartyRoleRef'
            imports:
              type: array
              description: The modules this module imports (owl:imports).
              items:
                $ref: '#/components/schemas/KnowledgeSpecificationRef'
            describes:
              type: array
              description: For a vocabulary, the modules whose terms it describes.
              items:
                $ref: '#/components/schemas/KnowledgeSpecificationRef'
            source:
              $ref: '#/components/schemas/KnowledgeSpecificationSource'
        - description: A remote module takes its content from a federation peer.
          anyOf:
            - not:
                required:
                  - specKind
                properties:
                  specKind:
                    enum:
                      - remote
            - properties:
                source:
                  properties:
                    kind:
                      enum:
                        - remoteEndpoint
      discriminator:
        propertyName: '@type'
        mapping:
          KnowledgeSpecification: '#/components/schemas/KnowledgeSpecification_FVO'
    KnowledgeSpecification_MVO:
      allOf:
        - $ref: '#/components/schemas/Extensible_FVO'
        - type: object
          description: >-
            The fields of an ontology module that can be changed. A change of lifecycleStatus is a
            governance transition (see x-lifecycle). The iri cannot change.
          properties:
            '@type':
              type: string
              description: Optional in requests; the API sets it when missing.
              enum:
                - KnowledgeSpecification
                - FederatedKnowledgeSpecification
            name:
              type: string
              description: Name of the module (FTO label).
            description:
              type: string
              description: Purpose of the module.
            version:
              type: string
            prefix:
              type: string
              description: >-
                The preferred namespace prefix. A module that declares several prefixes lists them
                comma-separated, as in FTO modules.json.
            layer:
              $ref: '#/components/schemas/OntologyLayerType'
            specKind:
              $ref: '#/components/schemas/SpecKindType'
            depth:
              type: string
              description: How complete the module is, for example Full ontology, Vocabulary or Scaffold.
            owner:
              $ref: '#/components/schemas/RelatedPartyRefOrPartyRoleRef'
            imports:
              type: array
              description: The modules this module imports (owl:imports).
              items:
                $ref: '#/components/schemas/KnowledgeSpecificationRef'
            describes:
              type: array
              description: For a vocabulary, the modules whose terms it describes.
              items:
                $ref: '#/components/schemas/KnowledgeSpecificationRef'
            source:
              $ref: '#/components/schemas/KnowledgeSpecificationSource'
            lifecycleStatus:
              $ref: '#/components/schemas/GovernedLifecycleStatusType'
        - anyOf:
            - description: A lifecycle transition, on its own.
              required:
                - lifecycleStatus
              properties:
                'lifecycleStatus': {}
                '@type':
                  type: string
              additionalProperties: false
            - description: A change of fields, without lifecycleStatus.
              not:
                required:
                  - lifecycleStatus
        - description: A remote module takes its content from a federation peer.
          anyOf:
            - not:
                required:
                  - specKind
                properties:
                  specKind:
                    enum:
                      - remote
            - properties:
                source:
                  properties:
                    kind:
                      enum:
                        - remoteEndpoint
      discriminator:
        propertyName: '@type'
        mapping:
          KnowledgeSpecification: '#/components/schemas/KnowledgeSpecification_MVO'
    KnowledgeSpecificationCreateEvent:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          description: KnowledgeSpecificationCreateEvent generic structure
          properties:
            event:
              $ref: '#/components/schemas/KnowledgeSpecificationEventPayload'
      discriminator:
        propertyName: '@type'
        mapping:
          KnowledgeSpecificationCreateEvent: '#/components/schemas/KnowledgeSpecificationCreateEvent'
    KnowledgeSpecificationAttributeValueChangeEvent:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          description: KnowledgeSpecificationAttributeValueChangeEvent generic structure
          properties:
            event:
              $ref: '#/components/schemas/KnowledgeSpecificationEventPayload'
      discriminator:
        propertyName: '@type'
        mapping:
          KnowledgeSpecificationAttributeValueChangeEvent: '#/components/schemas/KnowledgeSpecificationAttributeValueChangeEvent'
    KnowledgeSpecificationStateChangeEvent:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          description: KnowledgeSpecificationStateChangeEvent generic structure
          properties:
            event:
              $ref: '#/components/schemas/KnowledgeSpecificationEventPayload'
      discriminator:
        propertyName: '@type'
        mapping:
          KnowledgeSpecificationStateChangeEvent: '#/components/schemas/KnowledgeSpecificationStateChangeEvent'
    KnowledgeSpecificationDeleteEvent:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          description: KnowledgeSpecificationDeleteEvent generic structure
          properties:
            event:
              $ref: '#/components/schemas/KnowledgeSpecificationEventPayload'
      discriminator:
        propertyName: '@type'
        mapping:
          KnowledgeSpecificationDeleteEvent: '#/components/schemas/KnowledgeSpecificationDeleteEvent'
    KnowledgeSpecificationEventPayload:
      type: object
      description: The payload of a KnowledgeSpecification event
      properties:
        knowledgeSpecification:
          $ref: '#/components/schemas/KnowledgeSpecification'
    MappingConfidenceType:
      type: string
      description: How confident the author is in a mapping (bridge:confidence).
      enum:
        - high
        - medium
        - low
    Mapping:
      type: object
      description: >-
        A bridge statement between terms of two ontologies: the reified bridge:mapping of FTO
        bridge modules. Mappings follow the governed lifecycle of ontology modules. `status`
        (bridge:status) is derived from it and written to RDF: `agreed` for agreed and published
        mappings, `proposed` otherwise.
      properties:
        id:
          type: string
          readOnly: true
        href:
          type: string
          readOnly: true
        subject:
          type: string
          description: The term being mapped, as an IRI or a CURIE.
          example: irc:KPI
        predicate:
          type: string
          description: >-
            The relationship: rdfs:subClassOf, owl:equivalentClass, skos:exactMatch,
            skos:closeMatch, skos:broadMatch, or another property.
          example: rdfs:subClassOf
        object:
          type: string
          description: The term it is mapped to, as an IRI or a CURIE.
          example: an:KPI
        confidence:
          $ref: '#/components/schemas/MappingConfidenceType'
        rationale:
          type: string
          description: A one-line justification (bridge:rationale).
        lifecycleStatus:
          $ref: '#/components/schemas/GovernedLifecycleStatusType'
        status:
          type: string
          readOnly: true
          enum:
            - agreed
            - proposed
          description: The bridge:status, derived from lifecycleStatus.
    Mapping_FVO:
      type: object
      description: A bridge statement, as proposed. It starts as draft.
      required:
        - subject
        - predicate
        - object
      properties:
        subject:
          type: string
          format: iri-or-curie
          description: An IRI, or a CURIE of a prefix a registered module declares.
        predicate:
          type: string
          format: iri-or-curie
          description: An IRI, or a CURIE of a prefix a registered module declares.
        object:
          type: string
          format: iri-or-curie
          description: An IRI, or a CURIE of a prefix a registered module declares.
        confidence:
          $ref: '#/components/schemas/MappingConfidenceType'
        rationale:
          type: string
    Mapping_MVO:
      type: object
      description: The fields of a mapping that can be changed. A change of lifecycleStatus is a governance transition.
      anyOf:
        - description: A lifecycle transition, on its own.
          required:
            - lifecycleStatus
          properties:
            'lifecycleStatus': {}
          additionalProperties: false
        - description: A change of fields, without lifecycleStatus.
          not:
            required:
              - lifecycleStatus
      properties:
        subject:
          type: string
          format: iri-or-curie
          description: An IRI, or a CURIE of a prefix a registered module declares.
        predicate:
          type: string
          format: iri-or-curie
          description: An IRI, or a CURIE of a prefix a registered module declares.
        object:
          type: string
          format: iri-or-curie
          description: An IRI, or a CURIE of a prefix a registered module declares.
        confidence:
          $ref: '#/components/schemas/MappingConfidenceType'
        rationale:
          type: string
        lifecycleStatus:
          $ref: '#/components/schemas/GovernedLifecycleStatusType'
    ReviewTarget:
      type: object
      description: What a review item is about.
      required:
        - kind
        - id
      properties:
        kind:
          type: string
          enum:
            - module
            - mapping
        id:
          type: string
          description: The module id, or the mapping id within the module.
    ReviewItem:
      type: object
      description: A proposal, a review comment or a ruling on a module or on one of its mappings.
      properties:
        id:
          type: string
          readOnly: true
        kind:
          type: string
          enum:
            - proposal
            - comment
            - ruling
        target:
          $ref: '#/components/schemas/ReviewTarget'
        text:
          type: string
          description: The proposal note, the comment, or the rationale of the ruling.
        ruling:
          type: string
          enum:
            - agreed
            - rejected
          description: For a ruling, the decision.
        linkStatus:
          $ref: '#/components/schemas/LinkStatusType'
        author:
          type: string
          readOnly: true
          description: Who wrote the item, from the token.
        approver:
          type: string
          readOnly: true
          description: For a ruling, the approver, from the token.
        date:
          type: string
          format: date-time
          readOnly: true
      x-review-kinds:
        proposal: {role: ontology-editor, targetState: draft, transition: draft -> proposed}
        comment: {role: ontology-reviewer, targetState: [proposed, inReview]}
        ruling: {role: ontology-approver, targetState: inReview, transition: inReview -> agreed | rejected, condition: validation passes for agreed, sets: linkStatus}
    ReviewItem_FVO:
      type: object
      description: A review item, as added.
      required:
        - kind
        - target
      anyOf:
        - description: A proposal or a comment.
          properties:
            kind:
              enum:
                - proposal
                - comment
        - description: A ruling, which says agreed or rejected.
          required:
            - ruling
      properties:
        kind:
          type: string
          enum:
            - proposal
            - comment
            - ruling
        target:
          $ref: '#/components/schemas/ReviewTarget'
        text:
          type: string
        ruling:
          type: string
          enum:
            - agreed
            - rejected
        linkStatus:
          $ref: '#/components/schemas/LinkStatusType'
    LifecycleTransition:
      type: object
      description: A lifecycle transition of a module or of one of its mappings, as it happened.
      properties:
        id:
          type: string
          readOnly: true
        target:
          $ref: '#/components/schemas/ReviewTarget'
        from:
          $ref: '#/components/schemas/GovernedLifecycleStatusType'
        to:
          $ref: '#/components/schemas/GovernedLifecycleStatusType'
        actor:
          type: string
          readOnly: true
          description: Who made the transition, from the token.
        reviewItem:
          type: string
          readOnly: true
          description: The id of the proposal or ruling that made the transition, if one did.
        date:
          type: string
          format: date-time
          readOnly: true
    ValidationMessage:
      type: object
      required:
        - severity
        - text
      properties:
        severity:
          type: string
          enum:
            - error
            - warning
        text:
          type: string
    ValidationRuleResult:
      type: object
      required:
        - rule
        - passed
      properties:
        rule:
          type: string
          description: >-
            The structural rule (FTO check.py): parse (every file parses), layerAnnotation (the
            module and its classes carry a consistent fto:layer), layerMonotonicity (no class
            extends a deeper layer), parentsResolve (every superclass resolves), catalogIntegrity
            (every import resolves through the catalog to a file that declares it).
          enum:
            - parse
            - layerAnnotation
            - layerMonotonicity
            - parentsResolve
            - catalogIntegrity
        passed:
          type: boolean
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ValidationMessage'
    ShaclResult:
      type: object
      description: One result of a SHACL validation report.
      properties:
        focusNode:
          type: string
        resultPath:
          type: string
        severity:
          type: string
          enum:
            - Violation
            - Warning
            - Info
        message:
          type: string
        sourceShape:
          type: string
    ValidationReport:
      type: object
      description: The result of validating an ontology module.
      properties:
        moduleId:
          type: string
        runAt:
          type: string
          format: date-time
        conforms:
          type: boolean
          description: True when every structural rule passed and the SHACL validation conforms.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/ValidationRuleResult'
        shacl:
          type: object
          properties:
            conforms:
              type: boolean
            results:
              type: array
              items:
                $ref: '#/components/schemas/ShaclResult'
    TermDescription:
      type: object
      description: A description of one ontology term (fto_describe).
      properties:
        iri:
          type: string
        curie:
          type: string
        definedIn:
          type: array
          description: The modules that state something about the term.
          items:
            type: string
        labels:
          type: array
          items:
            type: string
        definitions:
          type: array
          items:
            type: string
        types:
          type: array
          items:
            type: string
        parents:
          type: array
          items:
            type: string
        matches:
          type: array
          items:
            type: object
            properties:
              predicate:
                type: string
              object:
                type: string
        layer:
          $ref: '#/components/schemas/OntologyLayerType'
        linkStatus:
          $ref: '#/components/schemas/LinkStatusType'
    TermHit:
      type: object
      description: A search hit (fto_search).
      properties:
        iri:
          type: string
        curie:
          type: string
        module:
          type: string
        layer:
          $ref: '#/components/schemas/OntologyLayerType'
        via:
          type: string
          description: The property the text matched, for example label or definition.
        text:
          type: string
    LayerChainEntry:
      type: object
      properties:
        term:
          type: string
        layer:
          $ref: '#/components/schemas/OntologyLayerType'
        module:
          type: string
        linkStatus:
          $ref: '#/components/schemas/LinkStatusType'
    TermLookupResult:
      type: object
      description: >-
        The result of a term lookup: `description` (and `layerChain` if asked) for an `iri`
        lookup, `hits` for a `q` search.
      properties:
        description:
          $ref: '#/components/schemas/TermDescription'
        hits:
          type: array
          items:
            $ref: '#/components/schemas/TermHit'
        layerChain:
          type: object
          description: The subclass chain of the term down to the Foundational layer (fto_layer_of).
          properties:
            chain:
              type: array
              items:
                $ref: '#/components/schemas/LayerChainEntry'
            endsAtFoundational:
              type: boolean
  parameters:
