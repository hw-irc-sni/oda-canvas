      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KnowledgeCreateEvent'
          examples:
            created:
              $ref: '#/components/examples/KnowledgeCreateEvent_example'
    KnowledgeAttributeValueChangeEvent:
      description: Knowledge attributeValueChange Event payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KnowledgeAttributeValueChangeEvent'
    KnowledgeStateChangeEvent:
      description: Knowledge stateChange Event payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KnowledgeStateChangeEvent'
    KnowledgeDeleteEvent:
      description: Knowledge delete Event payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KnowledgeDeleteEvent'
    RdfGraph:
      description: An RDF graph, in Turtle or JSON-LD
      required: true
      content:
        text/turtle:
          schema:
            type: string
          example: |
            @prefix ex: <https://example.org/incident/> .
            @prefix as: <https://example.org/ontology/telecom/assurance#> .
            ex:INC-1043 a as:Incident ;
                as:affects ex:cell-4712 .
        application/ld+json:
          schema:
            $ref: '#/components/schemas/JsonLdDocument'
  responses:
    Hub:
      description: Notified
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Hub'
          examples:
