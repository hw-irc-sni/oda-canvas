openapi: 3.0.1
info:
  title: Knowledge Management
  description: >-
    **Draft.** The Knowledge Management API of the TMFC060 Knowledge Management ODA Component
    reference implementation. TM Forum has not assigned an API number yet (TMFC060 open decision
    D-03), so the API is identified as `TMFxxx`.


    The API manages two resources, following the TMF630 v5 design guidelines:

    - `knowledge`: a knowledge-base. A hybrid of an RDF instance graph and a document and vector
    store, linked so that search hits carry the ontology IRIs of the entities they mention.

    - `knowledgeSpecification`: an ontology module of a federated, governed ontology.


    ### Operations

    - Retrieve an entity or a collection of entities depending on filter criteria

    - Partial update of an entity (including updating rules)

    - Create an entity (including default values and creation rules)

    - Delete an entity

    - Manage notification of events


    ### Security and roles

    Every operation needs a bearer JWT issued by the Canvas identity platform. The component reads
    its client roles from the token (`resource_access`). The `x-required-roles` extension on each
    operation lists the roles that may call it; **any one** of them is enough. A caller without one
    of them gets `403`.

    | Role | Allows |
    |---|---|
    | `knowledge-viewer` | Read knowledge-bases, search, query and recommend; read ontology modules |
    | `knowledge-editor` | Change knowledge-bases, upload documents and start ingestion |
    | `ontology-editor` | Create and propose ontology modules and mappings; revise rejected items |
    | `ontology-reviewer` | Move proposals to review, comment on them and run validation |
    | `ontology-approver` | Rule proposals agreed or rejected, publish and deprecate modules |
    | `canvasSystemRole` | Canvas operators, for example the Data Resource Management operator |


    ### Errors

    Errors use the TMF630 `Error` schema extended with the members of RFC 7807 (problem details),
    and are served as `application/json` or `application/problem+json`.
  version: 5.0.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  x-api-id: TMFxxx
servers:
  - url: 'https://{apiRoot}/tmf-api/knowledgeManagement/v5'
    variables:
      apiRoot:
        default: localhost:8080
tags:
  - name: events subscription
    description: Endpoints to register and terminate an Event Listener
  - name: notification listener
    description: Notifications for resource lifecycle and event notifications
security:
  - bearerAuth: []
paths:
  /hub:
    post:
      operationId: createHub
      summary: Create a subscription (hub) to receive Events
      description: Sets the communication endpoint to receive Events.
      tags:
        - events subscription
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      requestBody:
        $ref: '#/components/requestBodies/Hub_FVO'
      responses:
        '201':
          $ref: '#/components/responses/Hub'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
  '/hub/{id}':
    get:
      operationId: retrieveHub
      summary: Retrieve a subscription (hub)
      description: This operation retrieves the subscription to receive Events.
      tags:
        - events subscription
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Hub'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteHub
      summary: Remove a subscription (hub) to receive Events
      description: Removes the subscription.
      tags:
        - events subscription
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        An access token from the Canvas identity platform. The component client roles in
        `resource_access` are checked against the `x-required-roles` of each operation.
  schemas:
    Addressable:
      type: object
      description: Base schema for addressable entities
      properties:
        href:
          type: string
          description: Hyperlink reference
        id:
          type: string
          description: unique identifier
    Extensible:
      type: object
      description: >-
        Base Extensible schema for use in TMForum Open-APIs - When used for in a schema it means
        that the Entity described by the schema MUST be extended with the @type
      properties:
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
      required:
        - '@type'
    Entity:
      type: object
      description: Base entity schema for use in TMForum Open-APIs. Property.
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - $ref: '#/components/schemas/Addressable'
    EntityRef:
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - $ref: '#/components/schemas/Addressable'
        - type: object
          description: Entity reference schema to be use for all entityRef class.
          properties:
            id:
              type: string
              description: The identifier of the referred entity.
            href:
              type: string
              description: The URI of the referred entity.
            name:
              type: string
              description: Name of the referred entity.
            '@referredType':
              type: string
              description: The actual type of the target instance when needed for disambiguation.
          required:
            - id
    TimePeriod:
      type: object
      description: A period of time, either as a deadline (endDateTime only) a startDateTime only, or both
      properties:
        startDateTime:
          description: Start of the time period, using IETC-RFC-3339 format
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
        endDateTime:
          description: End of the time period, using IETC-RFC-3339 format
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
    PartyRef:
      type: object
      description: A Party reference
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          PartyRef: '#/components/schemas/PartyRef'
    PartyRoleRef:
      allOf:
        - $ref: '#/components/schemas/EntityRef'
        - type: object
          description: Party role reference. A party role represents the part played by a party in a given context.
          properties:
            partyId:
              type: string
              description: The identifier of the engaged party that is linked to the PartyRole object.
            partyName:
              type: string
              description: The name of the engaged party that is linked to the PartyRole object.
      discriminator:
        propertyName: '@type'
        mapping:
          PartyRoleRef: '#/components/schemas/PartyRoleRef'
    PartyRefOrPartyRoleRef:
      type: object
      description: A reference to a party or to a party role
      oneOf:
        - $ref: '#/components/schemas/PartyRef'
        - $ref: '#/components/schemas/PartyRoleRef'
      discriminator:
        propertyName: '@type'
        mapping:
          PartyRef: '#/components/schemas/PartyRef'
          PartyRoleRef: '#/components/schemas/PartyRoleRef'
    RelatedPartyRefOrPartyRoleRef:
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          description: >-
            RelatedParty reference. A related party defines party or party role or its reference,
            linked to a specific entity
          properties:
            role:
              description: >-
                Role played by the related party or party role in the context of the specific
                entity it is linked to. Such as 'owner', 'steward', 'contributor'
              type: string
            partyOrPartyRole:
              $ref: '#/components/schemas/PartyRefOrPartyRoleRef'
      discriminator:
        propertyName: '@type'
        mapping:
          RelatedPartyRefOrPartyRoleRef: '#/components/schemas/RelatedPartyRefOrPartyRoleRef'
    Event:
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          description: >-
            Event with common attributes. Each resource event (Create, AttributeValueChange,
            StateChange, Delete) extends it with an `event` payload that carries the resource.
          properties:
            href:
              type: string
              description: Hyperlink reference
            id:
              type: string
              description: unique identifier
            correlationId:
              type: string
              description: The correlation id for this event.
            domain:
              type: string
              description: The domain of the event.
            title:
              type: string
              description: The title of the event.
            description:
              type: string
              description: An explanation of the event.
            priority:
              type: string
              description: A priority.
            timeOccurred:
              type: string
              format: date-time
              description: The time the event occurred.
            source:
              $ref: '#/components/schemas/EntityRef'
            reportingSystem:
              $ref: '#/components/schemas/EntityRef'
            relatedParty:
              type: array
              description: Collection of related parties
              items:
                $ref: '#/components/schemas/RelatedPartyRefOrPartyRoleRef'
            eventId:
              type: string
              description: The identifier of the notification.
            eventTime:
              type: string
              format: date-time
              description: Time of the event occurrence.
            eventType:
              type: string
              description: The type of the notification.
            fieldPath:
              type: string
              description: >-
                For AttributeValueChange and StateChange events, the path of the changed
                attributes, as in TMF630.
      discriminator:
        propertyName: '@type'
        mapping:
          Event: '#/components/schemas/Event'
    Hub:
      type: object
      description: Sets the communication endpoint address the service instance must use to deliver notification information
      allOf:
        - $ref: '#/components/schemas/Entity'
        - properties:
            id:
              type: string
              description: Id of the listener
            callback:
              type: string
              description: The callback being registered.
            query:
              type: string
              description: >-
                Additional data to be passed: a filter on the events to deliver, for example
                `eventType=KnowledgeCreateEvent`.
          required:
            - callback
    Hub_FVO:
      type: object
      description: Sets the communication endpoint address the service instance must use to deliver notification information
      required:
        - callback
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - properties:
            callback:
              type: string
              description: The callback being registered.
            query:
              type: string
              description: Additional data to be passed
    JsonPatch:
      type: object
      description: A JSONPatch document as defined by RFC 6902
      required:
        - op
        - path
      properties:
        op:
          type: string
          description: The operation to be performed
          enum:
            - add
            - remove
            - replace
            - move
            - copy
            - test
        path:
          type: string
          description: A JSON-Pointer
        value:
          description: The value to be used within the operations.
        from:
          type: string
          description: A string containing a JSON Pointer value.
    JsonPatchOperations:
      description: JSONPatch Operations document as defined by RFC 6902
      type: array
      items:
        $ref: '#/components/schemas/JsonPatch'
    Error:
      description: >-
        Used when an API throws an Error, typically with a HTTP error response-code (3xx, 4xx, 5xx).
        The TMF630 Error, extended with the members of RFC 7807 problem details (`type`, `title`,
        `detail`, `instance`). `status` keeps its TMF630 string type and carries the HTTP status
        code, as the RFC 7807 `status` member does.
      discriminator:
        propertyName: '@type'
        mapping:
          Error: '#/components/schemas/Error'
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          required:
            - code
            - reason
          properties:
            code:
              type: string
              description: Application relevant detail, defined in the API or a common list.
            reason:
              type: string
              description: Explanation of the reason for the error which can be shown to a client user.
            message:
              type: string
              description: More details and corrective actions related to the error which can be shown to a client user.
            status:
              type: string
              pattern: '^[1-5][0-9][0-9]$'
              description: HTTP Error code extension
            referenceError:
              type: string
              description: URI of documentation describing the error.
            type:
              type: string
              format: uri-reference
              description: RFC 7807 - a URI reference that identifies the problem type.
              default: about:blank
            title:
              type: string
              description: RFC 7807 - a short, human-readable summary of the problem type.
            detail:
              type: string
              description: RFC 7807 - a human-readable explanation specific to this occurrence of the problem.
            instance:
              type: string
              format: uri-reference
              description: RFC 7807 - a URI reference that identifies the specific occurrence of the problem.
  parameters:
    Id:
      name: id
      required: true
      schema:
        type: string
      in: path
      description: Identifier of the resource
    Fields:
      name: fields
      in: query
      description: Comma-separated properties to be provided in response
      schema:
        type: string
    Offset:
      name: offset
      in: query
      description: Requested index for start of resources to be provided in response
      schema:
        type: integer
        minimum: 0
    Limit:
      name: limit
      in: query
      description: Requested number of resources to be provided in response
      schema:
        type: integer
        minimum: 1
    Sort:
      name: sort
      in: query
      description: >-
        Comma-separated properties for sorting. The default direction is ascending; a leading
        '-' changes the direction of that field.
      schema:
        type: string
    Filter:
      name: filter
      in: query
      description: Filter a collection using JSONPath
      allowReserved: true
      schema:
        type: string
        example: knowledge[?(@.storeKind=='hybrid')]
  headers:
    X-Total-Count:
      description: Total number of items matching criteria
      schema:
        type: integer
    X-Result-Count:
      description: Actual number of items returned in the response body
      schema:
        type: integer
  requestBodies:
    Hub_FVO:
      description: Data containing the callback endpoint to deliver the information
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Hub_FVO'
          examples:
            basic:
              summary: Subscribe to the knowledge-base events
              value:
                '@type': Hub
                callback: https://host/tmf-api/knowledgeManagement/v5/listener/knowledgeCreateEvent
                query: eventType=KnowledgeCreateEvent
  responses:
    Hub:
      description: Notified
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Hub'
          examples:
            basic:
              summary: Hub example
              value:
                '@type': Hub
                id: 5ab3c4d6
                callback: https://host/tmf-api/knowledgeManagement/v5/listener/knowledgeCreateEvent
                query: eventType=KnowledgeCreateEvent
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badRequest:
              $ref: '#/components/examples/Error400'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    '403':
      description: Forbidden. The token does not hold any of the roles in `x-required-roles`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingRole:
              $ref: '#/components/examples/Error403'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    '405':
      description: Method Not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    '409':
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    '501':
      description: Not Implemented
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    '503':
      description: Service Unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
  examples:
    Error400:
      summary: A request that fails validation
      value:
        '@type': Error
        code: '400'
        reason: Bad request
        message: The field storeKind must be one of graph, vector or hybrid
        status: '400'
        type: https://example.org/problems/validation
        title: Invalid request
        detail: The field storeKind must be one of graph, vector or hybrid
        instance: /tmf-api/knowledgeManagement/v5/knowledge
    Error403:
      summary: A caller without one of the required roles
      value:
        '@type': Error
        code: '403'
        reason: Forbidden
        message: This operation needs one of the roles knowledge-editor, canvasSystemRole
        status: '403'
        type: https://example.org/problems/missing-role
        title: Missing role
        detail: The token holds the role knowledge-viewer only
        instance: /tmf-api/knowledgeManagement/v5/knowledge
