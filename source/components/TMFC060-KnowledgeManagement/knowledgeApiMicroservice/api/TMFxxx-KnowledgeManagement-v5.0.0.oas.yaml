openapi: 3.0.1
info:
  title: Knowledge Management
  description: >-
    **Draft.** The Knowledge Management API of the TMFC060 Knowledge Management ODA Component
    reference implementation. TM Forum has not assigned an API number yet (TMFC060 open decision
    D-03), so the API is identified as `TMFxxx`.


    The API manages two resources, following the TMF630 v5 design guidelines:

    - `knowledge`: a knowledge-base. A hybrid of an RDF instance graph and a document and vector
    store, linked so that search hits carry the ontology IRIs of the entities they mention.

    - `knowledgeSpecification`: an ontology module of a federated, governed ontology.


    ### Operations

    - Retrieve an entity or a collection of entities depending on filter criteria

    - Partial update of an entity (including updating rules)

    - Create an entity (including default values and creation rules)

    - Delete an entity

    - Manage notification of events


    ### Security and roles

    Every operation needs a bearer JWT issued by the Canvas identity platform. The component reads
    its client roles from the token (`resource_access`). The `x-required-roles` extension on each
    operation lists the roles that may call it; **any one** of them is enough. A caller without one
    of them gets `403`.

    | Role | Allows |
    |---|---|
    | `knowledge-viewer` | Read knowledge-bases, search, query and recommend; read ontology modules |
    | `knowledge-editor` | Change knowledge-bases, upload documents and start ingestion |
    | `ontology-editor` | Create and propose ontology modules and mappings; revise rejected items |
    | `ontology-reviewer` | Move proposals to review, comment on them and run validation |
    | `ontology-approver` | Rule proposals agreed or rejected, publish and deprecate modules |
    | `canvasSystemRole` | Canvas operators, for example the Data Resource Management operator |


    ### Errors

    Errors use the TMF630 `Error` schema extended with the members of RFC 7807 (problem details),
    and are served as `application/json` or `application/problem+json`.
  version: 5.0.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  x-api-id: TMFxxx
servers:
  - url: 'https://{apiRoot}/tmf-api/knowledgeManagement/v5'
    variables:
      apiRoot:
        default: localhost:8080
tags:
  - name: knowledge
    description: Operations for knowledge-bases
  - name: events subscription
    description: Endpoints to register and terminate an Event Listener
  - name: notification listener
    description: Notifications for resource lifecycle and event notifications
security:
  - bearerAuth: []
paths:
  /hub:
    post:
      operationId: createHub
      summary: Create a subscription (hub) to receive Events
      description: Sets the communication endpoint to receive Events.
      tags:
        - events subscription
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      requestBody:
        $ref: '#/components/requestBodies/Hub_FVO'
      responses:
        '201':
          $ref: '#/components/responses/Hub'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
  '/hub/{id}':
    get:
      operationId: retrieveHub
      summary: Retrieve a subscription (hub)
      description: This operation retrieves the subscription to receive Events.
      tags:
        - events subscription
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Hub'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteHub
      summary: Remove a subscription (hub) to receive Events
      description: Removes the subscription.
      tags:
        - events subscription
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
  /knowledge:
    get:
      operationId: listKnowledge
      summary: List or find Knowledge objects
      description: This operation lists the knowledge-bases, filtered and paged.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      parameters:
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          $ref: '#/components/responses/200KnowledgeArray'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createKnowledge
      summary: Creates a Knowledge
      description: >-
        This operation creates a knowledge-base, with its graph and its vector collection. The
        knowledge-base's `lifecycleStatus` starts as `active`.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-editor
        - canvasSystemRole
      parameters:
        - $ref: '#/components/parameters/Fields'
      requestBody:
        $ref: '#/components/requestBodies/Knowledge_FVO'
      responses:
        '201':
          $ref: '#/components/responses/201Knowledge'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
  '/knowledge/{id}':
    get:
      operationId: retrieveKnowledge
      summary: Retrieves a Knowledge by ID
      description: This operation retrieves a knowledge-base.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          $ref: '#/components/responses/200Knowledge'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: patchKnowledge
      summary: Updates partially a Knowledge
      description: >-
        This operation updates a knowledge-base with a JSON merge patch. Changing `lifecycleStatus`
        publishes a `KnowledgeStateChangeEvent`; changing other fields publishes a
        `KnowledgeAttributeValueChangeEvent`.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-editor
        - canvasSystemRole
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Fields'
      requestBody:
        $ref: '#/components/requestBodies/Knowledge_MVO'
      responses:
        '200':
          $ref: '#/components/responses/200Knowledge'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteKnowledge
      summary: Deletes a Knowledge
      description: >-
        This operation deletes a knowledge-base with its graph, its vector collection and its
        documents.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-editor
        - canvasSystemRole
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
  '/knowledge/{id}/graph':
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: retrieveKnowledgeGraph
      summary: Retrieves the graph of a Knowledge
      description: >-
        Returns the RDF graph of the knowledge-base (Graph Store Protocol GET), in Turtle or
        JSON-LD depending on the Accept header. The graph holds the instance data only, not the
        ontology modules it conforms to.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      responses:
        '200':
          description: The graph of the knowledge-base
          content:
            text/turtle:
              schema:
                type: string
              example: |
                @prefix ex: <https://example.org/incident/> .
                @prefix as: <https://example.org/ontology/telecom/assurance#> .
                ex:INC-1042 a as:Incident ;
                    as:affects ex:cell-4711 ;
                    as:resolvedBy ex:RES-17 .
            application/ld+json:
              schema:
                $ref: '#/components/schemas/JsonLdDocument'
              example:
                '@context':
                  as: https://example.org/ontology/telecom/assurance#
                '@id': https://example.org/incident/INC-1042
                '@type': as:Incident
                as:affects:
                  '@id': https://example.org/incident/cell-4711
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '406':
          $ref: '#/components/responses/406'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: replaceKnowledgeGraph
      summary: Replaces the graph of a Knowledge
      description: Replaces the whole graph of the knowledge-base (Graph Store Protocol PUT).
      tags:
        - knowledge
      x-required-roles:
        - knowledge-editor
        - canvasSystemRole
      requestBody:
        $ref: '#/components/requestBodies/RdfGraph'
      responses:
        '204':
          description: Replaced
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: mergeKnowledgeGraph
      summary: Adds triples to the graph of a Knowledge
      description: Merges the given triples into the graph of the knowledge-base (Graph Store Protocol POST).
      tags:
        - knowledge
      x-required-roles:
        - knowledge-editor
        - canvasSystemRole
      requestBody:
        $ref: '#/components/requestBodies/RdfGraph'
      responses:
        '204':
          description: Merged
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: clearKnowledgeGraph
      summary: Empties the graph of a Knowledge
      description: Removes every triple from the graph of the knowledge-base (Graph Store Protocol DELETE). The knowledge-base itself is kept.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-editor
        - canvasSystemRole
      responses:
        '204':
          description: Emptied
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
  '/knowledge/{id}/query':
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: queryKnowledge
      summary: Runs a read-only SPARQL query on a Knowledge
      description: >-
        Runs a SPARQL 1.1 query (SELECT, ASK, CONSTRUCT or DESCRIBE) over the dataset of the
        knowledge-base: its graph plus the graphs of the ontology modules it conforms to. Update
        operations are rejected with `400`.


        **Limits.** A query runs for at most the `timeout` it asks for, capped by the server
        maximum; a query that runs longer gets `504`. A SELECT result is capped at the server's row
        limit; when the cap applies, the response has the header `X-Result-Truncated: true`.


        **Federation.** `SERVICE` clauses may only name the endpoint of a published
        `knowledgeSpecification` with `specKind: remote` (an allowlisted peer). Any other `SERVICE`
        IRI is rejected with `403` and the error `code` `SERVICE_NOT_ALLOWED`, before any remote
        call.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      parameters:
        - name: timeout
          in: query
          description: Query timeout in seconds, capped by the server maximum.
          schema:
            type: integer
            minimum: 1
            default: 30
      requestBody:
        required: true
        content:
          application/sparql-query:
            schema:
              type: string
            example: |
              PREFIX as: <https://example.org/ontology/telecom/assurance#>
              SELECT ?incident ?cell WHERE { ?incident a as:Incident ; as:affects ?cell } LIMIT 10
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: The SPARQL query.
      responses:
        '200':
          description: The query result
          headers:
            X-Result-Truncated:
              description: Present and `true` when the row cap was applied to a SELECT result.
              schema:
                type: boolean
          content:
            application/sparql-results+json:
              schema:
                $ref: '#/components/schemas/SparqlResults'
              example:
                head:
                  vars:
                    - incident
                    - cell
                results:
                  bindings:
                    - incident:
                        type: uri
                        value: https://example.org/incident/INC-1042
                      cell:
                        type: uri
                        value: https://example.org/incident/cell-4711
            text/turtle:
              schema:
                type: string
            application/ld+json:
              schema:
                $ref: '#/components/schemas/JsonLdDocument'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403Query'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '504':
          $ref: '#/components/responses/504'
        default:
          $ref: '#/components/responses/Error'
  '/knowledge/{id}/search':
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: searchKnowledge
      summary: Searches a Knowledge
      description: >-
        Hybrid search over the chunks of the knowledge-base: dense (embedding) and sparse (BM25)
        scores fused. Fields not set in the request fall back to the knowledge-base's `retrieval`
        settings. `iriFilter` keeps only chunks that mention at least one of the given ontology
        IRIs.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            example:
              query: cell outage after a power alarm
              topK: 3
              hybrid: true
              iriFilter:
                - https://example.org/ontology/telecom/assurance#PowerAlarm
      responses:
        '200':
          description: The search hits, best first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
              example:
                hits:
                  - chunkId: 9c2d-0004
                    text: After the mains power alarm the cell went down; the battery backup had failed.
                    score: 0.87
                    documentId: 7a10b3
                    entityIri:
                      - https://example.org/incident/INC-1042
                      - https://example.org/ontology/telecom/assurance#PowerAlarm
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
  '/knowledge/{id}/recommend':
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: recommendFromKnowledge
      summary: Recommends knowledge for a context
      description: >-
        Knowledge recommendation (KM-FX-06): ranks entities, documents or chunks for a context,
        using relevance and the ranking signals the knowledge-base has learnt (success rate,
        applicability, usage). Report what was used through `recommend/feedback`.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
            example:
              context: Cell 4711 is down after a mains power alarm
              iri:
                - https://example.org/incident/cell-4711
              topK: 3
      responses:
        '200':
          description: The recommended items, best first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResult'
              example:
                recommendationId: rec-5521
                items:
                  - itemId: RES-17
                    kind: entity
                    iri: https://example.org/incident/RES-17
                    label: Replace the battery backup and reset the site power unit
                    score: 0.91
                    signals:
                      successRate: 0.82
                      applicability: 0.95
                      usage: 41
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
  '/knowledge/{id}/recommend/feedback':
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: createRecommendationFeedback
      summary: Records feedback on a recommendation
      description: Records whether a recommended item was used and its outcome. The feedback updates the ranking signals.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationFeedback'
            example:
              recommendationId: rec-5521
              itemId: RES-17
              used: true
              outcome: success
      responses:
        '204':
          description: Recorded
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
  '/knowledge/{id}/document':
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listKnowledgeDocument
      summary: Lists the documents of a Knowledge
      description: Lists the documents uploaded to the knowledge-base.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      parameters:
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: Success
          headers:
            X-Total-Count:
              $ref: '#/components/headers/X-Total-Count'
            X-Result-Count:
              $ref: '#/components/headers/X-Result-Count'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
              example:
                - id: 7a10b3
                  href: https://host/tmf-api/knowledgeManagement/v5/knowledge/3f1e2c8a/document/7a10b3
                  name: site-power-runbook.pdf
                  mediaType: application/pdf
                  size: 482113
                  ingestionState: ingested
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createKnowledgeDocument
      summary: Uploads a document to a Knowledge
      description: >-
        Uploads a document (PDF, Markdown, HTML, Turtle, JSON-LD or JSON). The document is stored
        but not ingested; start ingestion with `ingest`. A document larger than the server's size
        cap gets `413`.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-editor
        - canvasSystemRole
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The document content.
                name:
                  type: string
                  description: Name of the document; defaults to the file name.
                description:
                  type: string
            example:
              file: (the PDF file content)
              name: site-power-runbook.pdf
              description: Runbook for site power failures
            encoding:
              file:
                contentType: application/pdf, text/markdown, text/html, text/turtle, application/ld+json, application/json
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
              examples:
                runbook:
                  $ref: '#/components/examples/Document_runbook'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '413':
          $ref: '#/components/responses/413'
        '415':
          $ref: '#/components/responses/415'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
  '/knowledge/{id}/document/{documentId}':
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: retrieveKnowledgeDocument
      summary: Retrieves the metadata of a document
      description: Retrieves the metadata of a document. Download its content from `…/content`.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
              examples:
                runbook:
                  $ref: '#/components/examples/Document_runbook'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteKnowledgeDocument
      summary: Deletes a document
      description: >-
        Deletes a document with its chunks and vectors. Triples extracted from it stay in the
        graph; their provenance still names the document.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-editor
        - canvasSystemRole
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
  '/knowledge/{id}/document/{documentId}/content':
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: retrieveKnowledgeDocumentContent
      summary: Downloads a document
      description: Downloads the content of a document, in its original media type.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      responses:
        '200':
          description: The document content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
  '/knowledge/{id}/ingest':
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: createKnowledgeIngestion
      summary: Starts the ingestion of knowledge
      description: >-
        Starts an ingestion: a TMF701 process flow with one task flow per Knowledge Management
        function (KM-FX-01 data processing to KM-FX-06 knowledge recommendation). Without
        `documentId`, every document not yet ingested is ingested. Follow the progress through the
        component's TMF701 Process Flow Management API.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-editor
        - canvasSystemRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
            example:
              source: upload
              documentId:
                - 7a10b3
      responses:
        '201':
          description: The process flow of the ingestion was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessFlowRef'
              example:
                '@type': ProcessFlowRef
                '@referredType': ProcessFlow
                id: pf-8812
                href: https://host/tmf-api/processFlowManagement/v4/processFlow/pf-8812
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
  /listener/knowledgeCreateEvent:
    post:
      operationId: knowledgeCreateEvent
      summary: Client listener for entity KnowledgeCreateEvent
      description: Example of a client listener for receiving the notification KnowledgeCreateEvent
      tags:
        - notification listener
      security: []
      requestBody:
        $ref: '#/components/requestBodies/KnowledgeCreateEvent'
      responses:
        '204':
          description: Notified
        default:
          $ref: '#/components/responses/Error'
  /listener/knowledgeAttributeValueChangeEvent:
    post:
      operationId: knowledgeAttributeValueChangeEvent
      summary: Client listener for entity KnowledgeAttributeValueChangeEvent
      description: Example of a client listener for receiving the notification KnowledgeAttributeValueChangeEvent
      tags:
        - notification listener
      security: []
      requestBody:
        $ref: '#/components/requestBodies/KnowledgeAttributeValueChangeEvent'
      responses:
        '204':
          description: Notified
        default:
          $ref: '#/components/responses/Error'
  /listener/knowledgeStateChangeEvent:
    post:
      operationId: knowledgeStateChangeEvent
      summary: Client listener for entity KnowledgeStateChangeEvent
      description: Example of a client listener for receiving the notification KnowledgeStateChangeEvent
      tags:
        - notification listener
      security: []
      requestBody:
        $ref: '#/components/requestBodies/KnowledgeStateChangeEvent'
      responses:
        '204':
          description: Notified
        default:
          $ref: '#/components/responses/Error'
  /listener/knowledgeDeleteEvent:
    post:
      operationId: knowledgeDeleteEvent
      summary: Client listener for entity KnowledgeDeleteEvent
      description: Example of a client listener for receiving the notification KnowledgeDeleteEvent
      tags:
        - notification listener
      security: []
      requestBody:
        $ref: '#/components/requestBodies/KnowledgeDeleteEvent'
      responses:
        '204':
          description: Notified
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        An access token from the Canvas identity platform. The component client roles in
        `resource_access` are checked against the `x-required-roles` of each operation.
  schemas:
    Addressable:
      type: object
      description: Base schema for addressable entities
      properties:
        href:
          type: string
          description: Hyperlink reference
        id:
          type: string
          description: unique identifier
    Extensible:
      type: object
      description: >-
        Base Extensible schema for use in TMForum Open-APIs - When used for in a schema it means
        that the Entity described by the schema MUST be extended with the @type
      properties:
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
      required:
        - '@type'
    Entity:
      type: object
      description: Base entity schema for use in TMForum Open-APIs. Property.
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - $ref: '#/components/schemas/Addressable'
    EntityRef:
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - $ref: '#/components/schemas/Addressable'
        - type: object
          description: Entity reference schema to be use for all entityRef class.
          properties:
            id:
              type: string
              description: The identifier of the referred entity.
            href:
              type: string
              description: The URI of the referred entity.
            name:
              type: string
              description: Name of the referred entity.
            '@referredType':
              type: string
              description: The actual type of the target instance when needed for disambiguation.
          required:
            - id
    TimePeriod:
      type: object
      description: A period of time, either as a deadline (endDateTime only) a startDateTime only, or both
      properties:
        startDateTime:
          description: Start of the time period, using IETC-RFC-3339 format
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
        endDateTime:
          description: End of the time period, using IETC-RFC-3339 format
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
    PartyRef:
      type: object
      description: A Party reference
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          PartyRef: '#/components/schemas/PartyRef'
    PartyRoleRef:
      allOf:
        - $ref: '#/components/schemas/EntityRef'
        - type: object
          description: Party role reference. A party role represents the part played by a party in a given context.
          properties:
            partyId:
              type: string
              description: The identifier of the engaged party that is linked to the PartyRole object.
            partyName:
              type: string
              description: The name of the engaged party that is linked to the PartyRole object.
      discriminator:
        propertyName: '@type'
        mapping:
          PartyRoleRef: '#/components/schemas/PartyRoleRef'
    PartyRefOrPartyRoleRef:
      type: object
      description: A reference to a party or to a party role
      oneOf:
        - $ref: '#/components/schemas/PartyRef'
        - $ref: '#/components/schemas/PartyRoleRef'
      discriminator:
        propertyName: '@type'
        mapping:
          PartyRef: '#/components/schemas/PartyRef'
          PartyRoleRef: '#/components/schemas/PartyRoleRef'
    RelatedPartyRefOrPartyRoleRef:
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          description: >-
            RelatedParty reference. A related party defines party or party role or its reference,
            linked to a specific entity
          properties:
            role:
              description: >-
                Role played by the related party or party role in the context of the specific
                entity it is linked to. Such as 'owner', 'steward', 'contributor'
              type: string
            partyOrPartyRole:
              $ref: '#/components/schemas/PartyRefOrPartyRoleRef'
      discriminator:
        propertyName: '@type'
        mapping:
          RelatedPartyRefOrPartyRoleRef: '#/components/schemas/RelatedPartyRefOrPartyRoleRef'
    Event:
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          description: >-
            Event with common attributes. Each resource event (Create, AttributeValueChange,
            StateChange, Delete) extends it with an `event` payload that carries the resource.
          properties:
            href:
              type: string
              description: Hyperlink reference
            id:
              type: string
              description: unique identifier
            correlationId:
              type: string
              description: The correlation id for this event.
            domain:
              type: string
              description: The domain of the event.
            title:
              type: string
              description: The title of the event.
            description:
              type: string
              description: An explanation of the event.
            priority:
              type: string
              description: A priority.
            timeOccurred:
              type: string
              format: date-time
              description: The time the event occurred.
            source:
              $ref: '#/components/schemas/EntityRef'
            reportingSystem:
              $ref: '#/components/schemas/EntityRef'
            relatedParty:
              type: array
              description: Collection of related parties
              items:
                $ref: '#/components/schemas/RelatedPartyRefOrPartyRoleRef'
            eventId:
              type: string
              description: The identifier of the notification.
            eventTime:
              type: string
              format: date-time
              description: Time of the event occurrence.
            eventType:
              type: string
              description: The type of the notification.
            fieldPath:
              type: string
              description: >-
                For AttributeValueChange and StateChange events, the path of the changed
                attributes, as in TMF630.
      discriminator:
        propertyName: '@type'
        mapping:
          Event: '#/components/schemas/Event'
    Hub:
      type: object
      description: Sets the communication endpoint address the service instance must use to deliver notification information
      allOf:
        - $ref: '#/components/schemas/Entity'
        - properties:
            id:
              type: string
              description: Id of the listener
            callback:
              type: string
              description: The callback being registered.
            query:
              type: string
              description: >-
                Additional data to be passed: a filter on the events to deliver, for example
                `eventType=KnowledgeCreateEvent`.
          required:
            - callback
    Hub_FVO:
      type: object
      description: Sets the communication endpoint address the service instance must use to deliver notification information
      required:
        - callback
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - properties:
            callback:
              type: string
              description: The callback being registered.
            query:
              type: string
              description: Additional data to be passed
    JsonPatch:
      type: object
      description: A JSONPatch document as defined by RFC 6902
      required:
        - op
        - path
      properties:
        op:
          type: string
          description: The operation to be performed
          enum:
            - add
            - remove
            - replace
            - move
            - copy
            - test
        path:
          type: string
          description: A JSON-Pointer
        value:
          description: The value to be used within the operations.
        from:
          type: string
          description: A string containing a JSON Pointer value.
    JsonPatchOperations:
      description: JSONPatch Operations document as defined by RFC 6902
      type: array
      items:
        $ref: '#/components/schemas/JsonPatch'
    Error:
      description: >-
        Used when an API throws an Error, typically with a HTTP error response-code (3xx, 4xx, 5xx).
        The TMF630 Error, extended with the members of RFC 7807 problem details (`type`, `title`,
        `detail`, `instance`). `status` keeps its TMF630 string type and carries the HTTP status
        code, as the RFC 7807 `status` member does.
      discriminator:
        propertyName: '@type'
        mapping:
          Error: '#/components/schemas/Error'
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          required:
            - code
            - reason
          properties:
            code:
              type: string
              description: Application relevant detail, defined in the API or a common list.
            reason:
              type: string
              description: Explanation of the reason for the error which can be shown to a client user.
            message:
              type: string
              description: More details and corrective actions related to the error which can be shown to a client user.
            status:
              type: string
              pattern: '^[1-5][0-9][0-9]$'
              description: HTTP Error code extension
            referenceError:
              type: string
              description: URI of documentation describing the error.
            type:
              type: string
              format: uri-reference
              description: RFC 7807 - a URI reference that identifies the problem type.
              default: about:blank
            title:
              type: string
              description: RFC 7807 - a short, human-readable summary of the problem type.
            detail:
              type: string
              description: RFC 7807 - a human-readable explanation specific to this occurrence of the problem.
            instance:
              type: string
              format: uri-reference
              description: RFC 7807 - a URI reference that identifies the specific occurrence of the problem.
    KnowledgeCategoryType:
      type: string
      description: The kind of knowledge a knowledge-base holds, from the TMFC060 inception form.
      enum:
        - know-what
        - know-why
        - know-how
        - know-who
    StoreKindType:
      type: string
      description: >-
        How a knowledge-base stores its knowledge: an RDF graph, a document and vector store, or
        both, linked (hybrid).
      enum:
        - graph
        - vector
        - hybrid
    KnowledgeSource:
      type: object
      description: >-
        A source the knowledge-base ingests from. `upload` takes documents uploaded to the
        knowledge-base. The `tmf…` kinds take events of that TM Forum API, delivered to the component
        through its subscribed events. `remote` takes content from a URL.
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - upload
            - tmf639
            - tmf638
            - tmf642
            - tmf628
            - tmf921
            - remote
          description: The kind of source.
        dependentApiName:
          type: string
          description: For `tmf…` kinds, the name of the component's dependent API that provides the events.
        eventTypes:
          type: array
          description: For `tmf…` kinds, the event types to ingest. All events of the API when empty.
          items:
            type: string
        query:
          type: string
          description: An optional filter on the source, in the source API's filter syntax.
        url:
          type: string
          format: uri
          description: For `remote`, the URL to ingest from.
    RetrievalSettings:
      type: object
      description: Default retrieval settings of a knowledge-base, used when a search request does not set them.
      properties:
        topK:
          type: integer
          minimum: 1
          default: 8
          description: Number of hits to return.
        scoreThreshold:
          type: number
          minimum: 0
          maximum: 1
          default: 0
          description: Minimum score of a hit.
        hybrid:
          type: boolean
          default: true
          description: Fuse dense (embedding) and sparse (BM25) scores.
    KnowledgeStatistics:
      type: object
      description: Size of a knowledge-base, computed by the component.
      readOnly: true
      properties:
        triples:
          type: integer
          minimum: 0
          description: Number of triples in the knowledge-base graph.
        documents:
          type: integer
          minimum: 0
          description: Number of documents.
        chunks:
          type: integer
          minimum: 0
          description: Number of indexed chunks in the vector store.
    Knowledge:
      allOf:
        - $ref: '#/components/schemas/Entity'
        - type: object
          description: >-
            A knowledge-base: an RDF instance graph and a document and vector store, linked so that
            search hits carry the IRIs of the entities they mention. It is typed by the ontology
            modules it conforms to.
          properties:
            name:
              type: string
              description: Name of the knowledge-base.
            description:
              type: string
              description: Description of the knowledge-base.
            version:
              type: string
              description: Version of the knowledge-base.
            lifecycleStatus:
              type: string
              description: >-
                Lifecycle status of the knowledge-base: `active`, `suspended` (no ingestion) or
                `retired` (read-only).
              example: active
            lastUpdate:
              type: string
              format: date-time
              readOnly: true
              description: Date and time of the last update.
            knowledgeCategory:
              type: array
              items:
                $ref: '#/components/schemas/KnowledgeCategoryType'
            storeKind:
              $ref: '#/components/schemas/StoreKindType'
            conformsTo:
              type: array
              description: The ontology modules that type the knowledge-base.
              items:
                $ref: '#/components/schemas/KnowledgeSpecificationRef'
            source:
              type: array
              items:
                $ref: '#/components/schemas/KnowledgeSource'
            retrieval:
              $ref: '#/components/schemas/RetrievalSettings'
            statistics:
              $ref: '#/components/schemas/KnowledgeStatistics'
            relatedParty:
              type: array
              items:
                $ref: '#/components/schemas/RelatedPartyRefOrPartyRoleRef'
            validFor:
              $ref: '#/components/schemas/TimePeriod'
      discriminator:
        propertyName: '@type'
        mapping:
          Knowledge: '#/components/schemas/Knowledge'
    Knowledge_FVO:
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          description: A knowledge-base, as given to create it.
          required:
            - name
          properties:
            name:
              type: string
            description:
              type: string
            version:
              type: string
            knowledgeCategory:
              type: array
              items:
                $ref: '#/components/schemas/KnowledgeCategoryType'
            storeKind:
              allOf:
                - $ref: '#/components/schemas/StoreKindType'
              default: hybrid
            conformsTo:
              type: array
              items:
                $ref: '#/components/schemas/KnowledgeSpecificationRef'
            source:
              type: array
              items:
                $ref: '#/components/schemas/KnowledgeSource'
            retrieval:
              $ref: '#/components/schemas/RetrievalSettings'
            relatedParty:
              type: array
              items:
                $ref: '#/components/schemas/RelatedPartyRefOrPartyRoleRef'
            validFor:
              $ref: '#/components/schemas/TimePeriod'
      discriminator:
        propertyName: '@type'
        mapping:
          Knowledge: '#/components/schemas/Knowledge_FVO'
    Knowledge_MVO:
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          description: >-
            The fields of a knowledge-base that can be changed. `storeKind` cannot change once the
            knowledge-base exists.
          properties:
            name:
              type: string
            description:
              type: string
            version:
              type: string
            lifecycleStatus:
              type: string
            knowledgeCategory:
              type: array
              items:
                $ref: '#/components/schemas/KnowledgeCategoryType'
            conformsTo:
              type: array
              items:
                $ref: '#/components/schemas/KnowledgeSpecificationRef'
            source:
              type: array
              items:
                $ref: '#/components/schemas/KnowledgeSource'
            retrieval:
              $ref: '#/components/schemas/RetrievalSettings'
            relatedParty:
              type: array
              items:
                $ref: '#/components/schemas/RelatedPartyRefOrPartyRoleRef'
            validFor:
              $ref: '#/components/schemas/TimePeriod'
      discriminator:
        propertyName: '@type'
        mapping:
          Knowledge: '#/components/schemas/Knowledge_MVO'
    KnowledgeRef:
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      description: Reference to a knowledge-base.
      discriminator:
        propertyName: '@type'
        mapping:
          KnowledgeRef: '#/components/schemas/KnowledgeRef'
    KnowledgeSpecificationRef:
      allOf:
        - $ref: '#/components/schemas/EntityRef'
        - type: object
          properties:
            iri:
              type: string
              format: uri
              description: The IRI of the ontology module, as an alternative way to identify it.
      description: Reference to an ontology module.
      discriminator:
        propertyName: '@type'
        mapping:
          KnowledgeSpecificationRef: '#/components/schemas/KnowledgeSpecificationRef'
    KnowledgeCreateEvent:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          description: KnowledgeCreateEvent generic structure
          properties:
            event:
              $ref: '#/components/schemas/KnowledgeEventPayload'
      discriminator:
        propertyName: '@type'
        mapping:
          KnowledgeCreateEvent: '#/components/schemas/KnowledgeCreateEvent'
    KnowledgeAttributeValueChangeEvent:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          description: KnowledgeAttributeValueChangeEvent generic structure
          properties:
            event:
              $ref: '#/components/schemas/KnowledgeEventPayload'
      discriminator:
        propertyName: '@type'
        mapping:
          KnowledgeAttributeValueChangeEvent: '#/components/schemas/KnowledgeAttributeValueChangeEvent'
    KnowledgeStateChangeEvent:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          description: KnowledgeStateChangeEvent generic structure
          properties:
            event:
              $ref: '#/components/schemas/KnowledgeEventPayload'
      discriminator:
        propertyName: '@type'
        mapping:
          KnowledgeStateChangeEvent: '#/components/schemas/KnowledgeStateChangeEvent'
    KnowledgeDeleteEvent:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          description: KnowledgeDeleteEvent generic structure
          properties:
            event:
              $ref: '#/components/schemas/KnowledgeEventPayload'
      discriminator:
        propertyName: '@type'
        mapping:
          KnowledgeDeleteEvent: '#/components/schemas/KnowledgeDeleteEvent'
    KnowledgeEventPayload:
      type: object
      description: The payload of a Knowledge event
      properties:
        knowledge:
          $ref: '#/components/schemas/Knowledge'
    JsonLdDocument:
      description: A JSON-LD document.
      oneOf:
        - type: object
          additionalProperties: true
        - type: array
          items:
            type: object
            additionalProperties: true
    SparqlResults:
      type: object
      description: SPARQL 1.1 query results in JSON (application/sparql-results+json), for SELECT and ASK.
      properties:
        head:
          type: object
          properties:
            vars:
              type: array
              items:
                type: string
            link:
              type: array
              items:
                type: string
        results:
          type: object
          properties:
            bindings:
              type: array
              items:
                type: object
                additionalProperties:
                  type: object
                  required:
                    - type
                    - value
                  properties:
                    type:
                      type: string
                      enum:
                        - uri
                        - literal
                        - bnode
                        - triple
                    value:
                      type: string
                    datatype:
                      type: string
                    xml:lang:
                      type: string
        boolean:
          type: boolean
          description: The result of an ASK query.
    SearchRequest:
      type: object
      description: A hybrid search over the chunks of a knowledge-base.
      required:
        - query
      properties:
        query:
          type: string
          description: The search text.
        topK:
          type: integer
          minimum: 1
        scoreThreshold:
          type: number
          minimum: 0
          maximum: 1
        hybrid:
          type: boolean
        iriFilter:
          type: array
          description: Keep only chunks that mention at least one of these IRIs.
          items:
            type: string
            format: uri
    SearchHit:
      type: object
      required:
        - chunkId
        - text
        - score
      properties:
        chunkId:
          type: string
        text:
          type: string
          description: The text of the chunk.
        score:
          type: number
          description: The fused relevance score.
        documentId:
          type: string
          description: The document the chunk comes from, if any.
        entityIri:
          type: array
          description: The IRIs of the graph entities the chunk mentions.
          items:
            type: string
            format: uri
    SearchResult:
      type: object
      properties:
        hits:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
    RecommendationRequest:
      type: object
      description: The context to recommend knowledge for.
      properties:
        context:
          type: string
          description: A description of the situation, in text.
        iri:
          type: array
          description: Entities of the situation, by IRI.
          items:
            type: string
            format: uri
        topK:
          type: integer
          minimum: 1
          default: 5
    RecommendationItem:
      type: object
      required:
        - itemId
        - kind
        - score
      properties:
        itemId:
          type: string
        kind:
          type: string
          enum:
            - entity
            - document
            - chunk
        iri:
          type: string
          format: uri
          description: The IRI of the item, for an entity.
        label:
          type: string
        score:
          type: number
        signals:
          type: object
          description: The ranking signals behind the score.
          properties:
            successRate:
              type: number
              minimum: 0
              maximum: 1
            applicability:
              type: number
              minimum: 0
              maximum: 1
            usage:
              type: integer
              minimum: 0
              description: How often the item was used.
    RecommendationResult:
      type: object
      properties:
        recommendationId:
          type: string
          description: Identifies this recommendation, for feedback.
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationItem'
    RecommendationFeedback:
      type: object
      required:
        - recommendationId
        - itemId
      properties:
        recommendationId:
          type: string
        itemId:
          type: string
        used:
          type: boolean
          description: Whether the item was used.
        outcome:
          type: string
          enum:
            - success
            - failure
            - ignored
          description: The outcome of using the item.
    Document:
      type: object
      description: A document uploaded to a knowledge-base.
      properties:
        id:
          type: string
          readOnly: true
        href:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
        mediaType:
          type: string
          example: application/pdf
        size:
          type: integer
          minimum: 0
          description: Size in bytes.
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        uploadDate:
          type: string
          format: date-time
        ingestionState:
          type: string
          enum:
            - pending
            - ingested
            - failed
        lastIngestion:
          $ref: '#/components/schemas/ProcessFlowRef'
    IngestRequest:
      type: object
      description: What to ingest.
      properties:
        source:
          type: string
          description: The kind of source to ingest from, one of the knowledge-base's `source[].kind`.
          enum:
            - upload
            - tmf639
            - tmf638
            - tmf642
            - tmf628
            - tmf921
            - remote
        documentId:
          type: array
          description: For `upload`, the documents to ingest. Every document not yet ingested when empty.
          items:
            type: string
        params:
          type: object
          description: Source-specific parameters, for example a TMF filter for an inventory snapshot.
          additionalProperties: true
    ProcessFlowRef:
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      description: >-
        Reference to a TMF701 process flow (`…/processFlowManagement/v4/processFlow/{id}`), served by
        the component's process flow API.
  parameters:
    Id:
      name: id
      required: true
      schema:
        type: string
      in: path
      description: Identifier of the resource
    Fields:
      name: fields
      in: query
      description: Comma-separated properties to be provided in response
      schema:
        type: string
    Offset:
      name: offset
      in: query
      description: Requested index for start of resources to be provided in response
      schema:
        type: integer
        minimum: 0
    Limit:
      name: limit
      in: query
      description: Requested number of resources to be provided in response
      schema:
        type: integer
        minimum: 1
    Sort:
      name: sort
      in: query
      description: >-
        Comma-separated properties for sorting. The default direction is ascending; a leading
        '-' changes the direction of that field.
      schema:
        type: string
    Filter:
      name: filter
      in: query
      description: Filter a collection using JSONPath
      allowReserved: true
      schema:
        type: string
        example: knowledge[?(@.storeKind=='hybrid')]
    DocumentId:
      name: documentId
      required: true
      schema:
        type: string
      in: path
      description: Identifier of the document
  headers:
    X-Total-Count:
      description: Total number of items matching criteria
      schema:
        type: integer
    X-Result-Count:
      description: Actual number of items returned in the response body
      schema:
        type: integer
  requestBodies:
    Hub_FVO:
      description: Data containing the callback endpoint to deliver the information
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Hub_FVO'
          examples:
            basic:
              summary: Subscribe to the knowledge-base events
              value:
                '@type': Hub
                callback: https://host/tmf-api/knowledgeManagement/v5/listener/knowledgeCreateEvent
                query: eventType=KnowledgeCreateEvent
    Knowledge_FVO:
