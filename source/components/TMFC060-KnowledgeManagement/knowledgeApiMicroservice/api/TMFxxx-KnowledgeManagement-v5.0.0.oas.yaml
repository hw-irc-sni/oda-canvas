openapi: 3.0.1
info:
  title: Knowledge Management
  description: >-
    **Draft.** The Knowledge Management API of the TMFC060 Knowledge Management ODA Component
    reference implementation. TM Forum has not assigned an API number yet (TMFC060 open decision
    D-03), so the API is identified as `TMFxxx`.


    The API manages two resources, following the TMF630 v5 design guidelines:

    - `knowledge`: a knowledge-base. A hybrid of an RDF instance graph and a document and vector
    store, linked so that search hits carry the ontology IRIs of the entities they mention.

    - `knowledgeSpecification`: an ontology module of a federated, governed ontology.


    Strings in JSON bodies must not hold the NUL character (U+0000): a body with one gets `400`.


    ### Operations

    - Retrieve an entity or a collection of entities depending on filter criteria

    - Partial update of an entity (including updating rules)

    - Create an entity (including default values and creation rules)

    - Delete an entity

    - Manage notification of events


    ### Security and roles

    Every operation needs a bearer JWT issued by the Canvas identity platform. The component reads
    its client roles from the token (`resource_access`). The `x-required-roles` extension on each
    operation lists the roles that may call it; **any one** of them is enough. A caller without one
    of them gets `403`.

    | Role | Allows |
    |---|---|
    | `knowledge-viewer` | Read knowledge-bases, search, query and recommend; read ontology modules |
    | `knowledge-editor` | Change knowledge-bases, upload documents and start ingestion |
    | `ontology-editor` | Create and propose ontology modules and mappings; revise rejected items |
    | `ontology-reviewer` | Move proposals to review, comment on them and run validation; list and retrieve knowledge-bases |
    | `ontology-approver` | Rule proposals agreed or rejected, publish and deprecate modules and knowledge-bases; list and retrieve knowledge-bases |
    | `canvasSystemRole` | Canvas operators, for example the Data Resource Management operator |


    ### Errors

    Errors use the TMF630 `Error` schema extended with the members of RFC 7807 (problem details),
    and are served as `application/json` or `application/problem+json`.
  version: 5.0.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  x-api-id: TMFxxx
servers:
  - url: 'https://{apiRoot}/tmf-api/knowledgeManagement/v5'
    variables:
      apiRoot:
        default: localhost:8080
tags:
  - name: knowledge
    description: Operations for knowledge-bases
  - name: knowledgeSpecification
    description: Operations for ontology modules
  - name: events subscription
    description: Endpoints to register and terminate an Event Listener
  - name: notification listener
    description: Notifications for resource lifecycle and event notifications
security:
  - bearerAuth: []
paths:
  /hub:
    post:
      operationId: createHub
      summary: Create a subscription (hub) to receive Events
      description: Sets the communication endpoint to receive Events.
      tags:
        - events subscription
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      requestBody:
        $ref: '#/components/requestBodies/Hub_FVO'
      responses:
        '201':
          $ref: '#/components/responses/Hub'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
  '/hub/{id}':
    get:
      operationId: retrieveHub
      summary: Retrieve a subscription (hub)
      description: This operation retrieves the subscription to receive Events.
      tags:
        - events subscription
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Hub'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteHub
      summary: Remove a subscription (hub) to receive Events
      description: Removes the subscription.
      tags:
        - events subscription
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
  /knowledge:
    get:
      operationId: listKnowledge
      summary: List or find Knowledge objects
      description: This operation lists the knowledge-bases, filtered and paged.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - ontology-reviewer
        - ontology-approver
        - canvasSystemRole
      parameters:
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          $ref: '#/components/responses/200KnowledgeArray'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createKnowledge
      summary: Creates a Knowledge
      description: >-
        This operation creates a knowledge-base, with its graph and its vector collection. The
        knowledge-base starts as `draft` (see `x-lifecycle` on `Knowledge`).
      tags:
        - knowledge
      x-required-roles:
        - knowledge-editor
        - canvasSystemRole
      parameters:
        - $ref: '#/components/parameters/Fields'
      requestBody:
        $ref: '#/components/requestBodies/Knowledge_FVO'
      responses:
        '201':
          $ref: '#/components/responses/201Knowledge'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          $ref: '#/components/responses/Error'
  '/knowledge/{id}':
    get:
      operationId: retrieveKnowledge
      summary: Retrieves a Knowledge by ID
      description: This operation retrieves a knowledge-base.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - ontology-reviewer
        - ontology-approver
        - canvasSystemRole
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          $ref: '#/components/responses/200Knowledge'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: patchKnowledge
      summary: Updates partially a Knowledge
      description: >-
        This operation updates a knowledge-base with a JSON merge patch. Changing `lifecycleStatus`
        is a governance transition: each transition is allowed to one role, as listed in the
        `x-lifecycle` extension of `Knowledge` (403 for another role, 409 for a transition that is
        not listed), and publishes a `KnowledgeStateChangeEvent`. Other fields can be changed by a
        `knowledge-editor` unless the knowledge-base is `deprecated` (409); a change publishes a
        `KnowledgeAttributeValueChangeEvent`.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-editor
        - ontology-reviewer
        - ontology-approver
        - canvasSystemRole
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Fields'
      requestBody:
        $ref: '#/components/requestBodies/Knowledge_MVO'
      responses:
        '200':
          $ref: '#/components/responses/200Knowledge'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteKnowledge
      summary: Deletes a Knowledge
      description: >-
        This operation deletes a knowledge-base with its graph, its vector collection and its
        documents.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-editor
        - canvasSystemRole
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          $ref: '#/components/responses/Error'
  '/knowledge/{id}/graph':
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: retrieveKnowledgeGraph
      summary: Retrieves the graph of a Knowledge
      description: >-
        Returns the RDF graph of the knowledge-base (Graph Store Protocol GET), in Turtle or
        JSON-LD depending on the Accept header. The graph holds the instance data only, not the
        ontology modules it conforms to.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      responses:
        '200':
          description: The graph of the knowledge-base
          content:
            text/turtle:
              schema:
                type: string
              example: |
                @prefix ex: <https://example.org/incident/> .
                @prefix as: <https://example.org/ontology/telecom/assurance#> .
                ex:INC-1042 a as:Incident ;
                    as:affects ex:cell-4711 ;
                    as:resolvedBy ex:RES-17 .
            application/ld+json:
              schema:
                $ref: '#/components/schemas/JsonLdDocument'
              example:
                '@context':
                  as: https://example.org/ontology/telecom/assurance#
                '@id': https://example.org/incident/INC-1042
                '@type': as:Incident
                as:affects:
                  '@id': https://example.org/incident/cell-4711
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '406':
          $ref: '#/components/responses/406'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: replaceKnowledgeGraph
      summary: Replaces the graph of a Knowledge
      description: Replaces the whole graph of the knowledge-base (Graph Store Protocol PUT).
      tags:
        - knowledge
      x-required-roles:
        - knowledge-editor
        - canvasSystemRole
      requestBody:
        $ref: '#/components/requestBodies/RdfGraph'
      responses:
        '204':
          description: Replaced
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: mergeKnowledgeGraph
      summary: Adds triples to the graph of a Knowledge
      description: Merges the given triples into the graph of the knowledge-base (Graph Store Protocol POST).
      tags:
        - knowledge
      x-required-roles:
        - knowledge-editor
        - canvasSystemRole
      requestBody:
        $ref: '#/components/requestBodies/RdfGraph'
      responses:
        '204':
          description: Merged
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: clearKnowledgeGraph
      summary: Empties the graph of a Knowledge
      description: Removes every triple from the graph of the knowledge-base (Graph Store Protocol DELETE). The knowledge-base itself is kept.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-editor
        - canvasSystemRole
      responses:
        '204':
          description: Emptied
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
  '/knowledge/{id}/query':
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: queryKnowledge
      summary: Runs a read-only SPARQL query on a Knowledge
      description: >-
        Runs a SPARQL 1.1 query (SELECT, ASK, CONSTRUCT or DESCRIBE) over the dataset of the
        knowledge-base: its graph plus the graphs of the ontology modules it conforms to. Update
        operations are rejected with `400`.


        **Limits.** A query runs for at most the `timeout` it asks for, capped by the server
        maximum; a query that runs longer gets `504`. A SELECT result is capped at the server's row
        limit; when the cap applies, the response has the header `X-Result-Truncated: true`.


        **Federation.** `SERVICE` clauses may only name the endpoint of a published
        `knowledgeSpecification` with `specKind: remote` (an allowlisted peer). Any other `SERVICE`
        IRI is rejected with `403` and the error `code` `SERVICE_NOT_ALLOWED`, before any remote
        call.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      parameters:
        - name: timeout
          in: query
          description: Query timeout in seconds, capped by the server maximum.
          schema:
            type: integer
            minimum: 1
            default: 30
      requestBody:
        required: true
        content:
          application/sparql-query:
            schema:
              type: string
              format: sparql-query
            example: |
              PREFIX as: <https://example.org/ontology/telecom/assurance#>
              SELECT ?incident ?cell WHERE { ?incident a as:Incident ; as:affects ?cell } LIMIT 10
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  format: sparql-query
                  description: The SPARQL query.
      responses:
        '200':
          description: The query result
          headers:
            X-Result-Truncated:
              description: Present and `true` when the row cap was applied to a SELECT result.
              schema:
                type: boolean
          content:
            application/sparql-results+json:
              schema:
                $ref: '#/components/schemas/SparqlResults'
              example:
                head:
                  vars:
                    - incident
                    - cell
                results:
                  bindings:
                    - incident:
                        type: uri
                        value: https://example.org/incident/INC-1042
                      cell:
                        type: uri
                        value: https://example.org/incident/cell-4711
            text/turtle:
              schema:
                type: string
            application/ld+json:
              schema:
                $ref: '#/components/schemas/JsonLdDocument'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403Query'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '500':
          $ref: '#/components/responses/500'
        '502':
          $ref: '#/components/responses/502'
        '504':
          $ref: '#/components/responses/504'
        default:
          $ref: '#/components/responses/Error'
  '/knowledge/{id}/search':
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: searchKnowledge
      summary: Searches a Knowledge
      description: >-
        Hybrid search over the chunks of the knowledge-base: dense (embedding) and sparse (BM25)
        scores fused (reciprocal rank fusion, normalised so that a chunk ranked first by both scores 1);
        with `hybrid: false`, dense only, scored by cosine similarity. Fields not set in the request fall
        back to the knowledge-base's `retrieval` settings. `iriFilter` keeps only chunks that mention at
        least one of the given ontology IRIs or a subclass of one. Without an embedding model a hybrid
        search runs on the sparse side alone (`X-Search-Mode: sparse`) and a dense-only one answers `503`.
        A `graph` knowledge-base has no chunks (`409`).
      tags:
        - knowledge
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            example:
              query: cell outage after a power alarm
              topK: 3
              hybrid: true
              iriFilter:
                - https://example.org/ontology/telecom/assurance#PowerAlarm
      responses:
        '200':
          description: The search hits, best first
          headers:
            X-Search-Mode:
              description: >-
                Which search ran: `hybrid` (dense and sparse fused), `dense` (with `hybrid: false`), or `sparse`
                (the keyword side alone, when no embedding model is available).
              schema:
                type: string
                enum:
                  - hybrid
                  - dense
                  - sparse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
              example:
                hits:
                  - chunkId: 9c2d-0004
                    text: After the mains power alarm the cell went down; the battery backup had failed.
                    score: 0.87
                    documentId: 7a10b3
                    entityIri:
                      - https://example.org/incident/INC-1042
                      - https://example.org/ontology/telecom/assurance#PowerAlarm
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        default:
          $ref: '#/components/responses/Error'
  '/knowledge/{id}/recommend':
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: recommendFromKnowledge
      summary: Recommends knowledge for a context
      description: >-
        Knowledge recommendation (KM-FX-06): ranks entities, documents or chunks for a context,
        using relevance and the ranking signals the knowledge-base has learnt (success rate,
        applicability, usage). Report what was used through `recommend/feedback`.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
            example:
              context: Cell 4711 is down after a mains power alarm
              iri:
                - https://example.org/incident/cell-4711
              topK: 3
      responses:
        '200':
          description: The recommended items, best first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResult'
              example:
                recommendationId: rec-5521
                items:
                  - itemId: RES-17
                    kind: entity
                    iri: https://example.org/incident/RES-17
                    label: Replace the battery backup and reset the site power unit
                    score: 0.91
                    signals:
                      successRate: 0.82
                      applicability: 0.95
                      usage: 41
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
  '/knowledge/{id}/recommend/feedback':
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: createRecommendationFeedback
      summary: Records feedback on a recommendation
      description: Records whether a recommended item was used and its outcome. The feedback updates the ranking signals.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationFeedback'
            example:
              recommendationId: rec-5521
              itemId: RES-17
              used: true
              outcome: success
      responses:
        '204':
          description: Recorded
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
  '/knowledge/{id}/document':
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listKnowledgeDocument
      summary: Lists the documents of a Knowledge
      description: Lists the documents uploaded to the knowledge-base.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-viewer
        - knowledge-editor
        - canvasSystemRole
      parameters:
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Success
          headers:
            X-Total-Count:
              $ref: '#/components/headers/X-Total-Count'
            X-Result-Count:
              $ref: '#/components/headers/X-Result-Count'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
              example:
                - id: 7a10b3
                  href: https://host/tmf-api/knowledgeManagement/v5/knowledge/3f1e2c8a/document/7a10b3
                  name: site-power-runbook.pdf
                  mediaType: application/pdf
                  size: 482113
                  ingestionState: ingested
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createKnowledgeDocument
      summary: Uploads a document to a Knowledge
      description: >-
        Uploads a document (PDF, Markdown, HTML, Turtle, JSON-LD or JSON). The document is stored
        but not ingested; start ingestion with `ingest`. A document larger than the server's size
        cap gets `413`.
      tags:
        - knowledge
      x-required-roles:
        - knowledge-editor
        - canvasSystemRole
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The document content.
                name:
                  type: string
                  description: Name of the document; defaults to the file name.
                description:
                  type: string
            example:
              file: "# Site power runbook\n\nWhen the mains power alarm is raised, check the rectifier first."
              name: site-power-runbook.md
              description: Runbook for site power failures
            encoding:
              file:
                contentType: text/markdown, application/pdf, text/html, text/turtle, application/ld+json, application/json
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
              examples:
                runbook:
