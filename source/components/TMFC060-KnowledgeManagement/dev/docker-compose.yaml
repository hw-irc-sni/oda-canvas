# Backing services for running the TMFC060 microservices locally.
#   docker compose -f dev/docker-compose.yaml up -d
# Postgres: localhost:5432 (tmfc060/tmfc060, database tmfc060). Qdrant: http://localhost:6333
name: tmfc060-dev
services:
  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: tmfc060
      POSTGRES_PASSWORD: tmfc060
      POSTGRES_DB: tmfc060
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tmfc060 -d tmfc060"]
      interval: 5s
      timeout: 3s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.20.2
    ulimits:  # one collection per knowledge-base; each keeps files open
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
volumes:
  postgres-data:
  qdrant-data:
