{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "km.pgName" . }}
  labels:
    {{- include "km.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "km.selectorLabels" (dict "root" . "workload" "postgresql") | nindent 4 }}
  ports:
  - name: tcp-postgresql
    port: 5432
    targetPort: postgresql
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "km.pgName" . }}-hl
  labels:
    {{- include "km.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "km.selectorLabels" (dict "root" . "workload" "postgresql") | nindent 4 }}
  ports:
  - name: tcp-postgresql
    port: 5432
    targetPort: postgresql
{{- end }}
