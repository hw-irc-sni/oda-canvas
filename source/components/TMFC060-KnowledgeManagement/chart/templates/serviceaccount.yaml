apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "km.serviceAccount" . }}
  labels:
    {{- include "km.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The worker, the MCP server and PostgreSQL never call the Kubernetes API
automountServiceAccountToken: false
---
# The API's: a token only when it reads ModelGatewayService resources (modelResolver.modelGatewayService.enabled)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "km.apiServiceAccount" . }}
  labels:
    {{- include "km.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.modelResolver.modelGatewayService.enabled }}
