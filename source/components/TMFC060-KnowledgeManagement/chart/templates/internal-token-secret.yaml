{{- /* The workers' service token for the API's internal port: created once, then kept across upgrades (lookup); removed on uninstall */ -}}
{{- $name := include "km.tokenSecret" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "km.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $existing $existing.data $existing.data.token }}
  token: {{ $existing.data.token }}
  {{- else }}
  token: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
