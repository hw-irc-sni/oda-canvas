{{- if and .Values.postgresql.enabled (not .Values.postgresql.existingSecret) }}
{{- /* Generated once, kept across upgrades (lookup) and on uninstall (with the data PVC) */ -}}
{{- $name := include "km.pgSecret" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := randAlphaNum 32 -}}
{{- if and $existing $existing.data $existing.data.password -}}
{{- $password = b64dec $existing.data.password -}}
{{- end -}}
{{- $pg := .Values.postgresql -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  # No oda.tmforum.org/componentName label: the Secret must outlive the Component, like the data it opens
  labels:
    {{- include "km.unownedLabels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  username: {{ $pg.username | b64enc }}
  password: {{ $password | b64enc }}
  database: {{ $pg.database | b64enc }}
  url: {{ printf "postgresql://%s:%s@%s:5432/%s" $pg.username $password (include "km.pgName" .) $pg.database | b64enc }}
{{- end }}
