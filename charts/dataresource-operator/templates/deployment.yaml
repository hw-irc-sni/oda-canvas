apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dataresource-operator.name" . }}
  labels:
    app: {{ include "dataresource-operator.name" . }}
    oda.tmforum.org/operator: "true"
    oda.tmforum.org/operatorName: data-resource-operator
    oda.tmforum.org/operatorId: TMFOP012
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "dataresource-operator.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "dataresource-operator.name" . }}
    spec:
      serviceAccountName: {{ include "dataresource-operator.name" . }}-account
      {{- include "dataresource-operator.pullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
      containers:
      - name: dataresource-operator
        image: {{ include "dataresource-operator.image" . }}
        imagePullPolicy: {{ include "dataresource-operator.imagePullPolicy" . }}
        env:
        - name: LOGGING
          value: {{ .Values.loglevel | quote }}
        - name: KEYCLOAK_URL
          value: {{ .Values.keycloak.url | quote }}
        - name: KEYCLOAK_REALM
          value: {{ .Values.keycloak.realm | quote }}
        - name: OIDC_DIR
          value: /etc/dataresource-operator/oidc
        - name: POLL_INTERVAL_SECONDS
          value: {{ .Values.pollIntervalSeconds | quote }}
        - name: COMPONENT_NAMESPACE
          value: {{ .Values.componentNamespace | quote }}
        ports:
        - name: health
          containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 30
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          {{- include "dataresource-operator.securityContext" . | nindent 10 }}
        volumeMounts:
        - name: oidc
          mountPath: /etc/dataresource-operator/oidc
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      # Written by the setup Job; optional, so the operator starts before it exists and picks it up later
      - name: oidc
        secret:
          secretName: {{ .Values.oidc.secretName }}
          optional: true
      - name: tmp
        emptyDir: {}
