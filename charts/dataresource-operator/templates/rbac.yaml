apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dataresource-operator.name" . }}-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dataresource-operator.name" . }}-role-cluster
rules:
  # Framework: kopf observes CRDs and namespaces
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch]
  # Framework: events about handler progress
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create]
  # Application: the DataResourceConfigs it handles (status only on provider odaComponent)
  - apiGroups: [oda.tmforum.org]
    resources: [dataresourceconfigs]
    verbs: [get, list, watch, patch]
  - apiGroups: [oda.tmforum.org]
    resources: [dataresourceconfigs/status]
    verbs: [get, patch]
  # Application: resolving provider components and their APIs
  - apiGroups: [oda.tmforum.org]
    resources: [components, exposedapis]
    verbs: [get, list, watch]
  # Application: the DependentAPI of each consumer binding
  - apiGroups: [oda.tmforum.org]
    resources: [dependentapis]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [oda.tmforum.org]
    resources: [dependentapis/status]
    verbs: [get, patch]
  # Application: binding Secrets in consumer namespaces; written without reading any Secret
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dataresource-operator.name" . }}-rolebinding-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dataresource-operator.name" . }}-role-cluster
subjects:
  - kind: ServiceAccount
    name: {{ include "dataresource-operator.name" . }}-account
    namespace: {{ .Release.Namespace }}
