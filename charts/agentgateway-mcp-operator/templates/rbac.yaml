apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentgateway-mcp-operator.name" . }}-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "agentgateway-mcp-operator.name" . }}-role-cluster
rules:
  # Framework: kopf observes CRDs and namespaces, and posts events
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create]
  # Application: the MCP ExposedAPIs, read only (nothing is written to them)
  - apiGroups: [oda.tmforum.org]
    resources: [exposedapis]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agentgateway-mcp-operator.name" . }}-rolebinding-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "agentgateway-mcp-operator.name" . }}-role-cluster
subjects:
  - kind: ServiceAccount
    name: {{ include "agentgateway-mcp-operator.name" . }}-account
    namespace: {{ .Release.Namespace }}
---
# The agentgateway config, and its pods (nudged so they reload the config now), in the gateway's namespace only
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentgateway-mcp-operator.name" . }}-gateway
  namespace: {{ .Values.gateway.namespace }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ .Values.gateway.configMap | quote }}]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentgateway-mcp-operator.name" . }}-gateway
  namespace: {{ .Values.gateway.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agentgateway-mcp-operator.name" . }}-gateway
subjects:
  - kind: ServiceAccount
    name: {{ include "agentgateway-mcp-operator.name" . }}-account
    namespace: {{ .Release.Namespace }}
