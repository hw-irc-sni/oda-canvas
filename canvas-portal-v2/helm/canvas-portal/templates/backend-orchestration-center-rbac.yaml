{{- $orchestration := .Values.backend.orchestrationCenter | default dict }}
{{- $secret := $orchestration.passwordSecret | default dict }}
{{- if and $orchestration.url $secret.name }}
{{- $namespace := $secret.namespace | default .Release.Namespace }}
# Lets the backend read the Orchestration Center password, and nothing else, in that namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "canvas-portal.backend.fullname" . }}-orchestration-center
  namespace: {{ $namespace }}
  labels:
    {{- include "canvas-portal.backend.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secret.name | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "canvas-portal.backend.fullname" . }}-orchestration-center
  namespace: {{ $namespace }}
  labels:
    {{- include "canvas-portal.backend.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "canvas-portal.backend.fullname" . }}-orchestration-center
subjects:
  - kind: ServiceAccount
    name: {{ include "canvas-portal.backend.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
